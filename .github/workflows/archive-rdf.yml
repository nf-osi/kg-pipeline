# Archive RDF snapshot to Synapse and generate incremental diff after a successful build.
# Runs as a separate workflow so Synapse failures never block image publishing.
name: Archive and diff RDF

on:
  workflow_run:
    workflows: ["Build image"]
    types: [completed]

jobs:
  archive-diff:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ./orchestration numpy pyyaml

      - name: Download RDF artifacts from build
        uses: actions/download-artifact@v7
        with:
          name: kg-data
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate RDF diff
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
        run: python scripts/diff_rdf.py --output-dir data/diff/

      - name: Archive RDF to Synapse
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
        run: |
          python scripts/archive_rdf.py \
            --comment "Build ${{ github.event.workflow_run.head_branch }} (run ${{ github.event.workflow_run.run_number }})"

      - name: Upload diff artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kg-diff
          path: data/diff/
          if-no-files-found: ignore

      - name: Commit updated data_sources.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_sources.yaml
          git diff --staged --quiet || git commit -m "chore: update rdf archive version [skip ci]"
          git push
