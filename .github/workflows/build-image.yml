# Build knowledgegraph image (QLever) on tag or manual trigger
# Image tagged with version or run number for manual trigger
name: Build image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom image tag (optional, defaults to build-<run_number>)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kg-qlever
  IMAGE_NAME_TEXT: ${{ github.repository_owner }}/kg-qlever-text
  ECR_REPOSITORY: kg-qlever
  ECR_REPOSITORY_TEXT: kg-qlever-text
  RMLMAPPER_VERSION: "8.1.0"
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python dependencies
        run: pip install -e ./orchestration numpy pyyaml

      - name: Download RMLMapper
        run: |
          curl -sL -o tools/rmlmapper-${RMLMAPPER_VERSION}.jar \
            "https://github.com/RMLio/rmlmapper-java/releases/download/v${RMLMAPPER_VERSION}/rmlmapper-${RMLMAPPER_VERSION}-r380-all.jar"

      - name: Materialize RDF pipeline
        run: dagster asset materialize -m dagster_pipeline --select "*"

      - name: Validate RDF outputs
        run: ./scripts/validate_rdf.sh

      # Generate QLever text index files
      - name: Fetch PubTator3 annotations
        working-directory: pubs
        run: |
          python3 scripts/fetch_pubtator3.py subsets/tools-portal-pmc-derivatives-ok.tsv

      - name: Generate QLever text index files
        working-directory: pubs
        run: |
          python3 scripts/pubtator3_to_qlever.py

      - name: Upload artifacts (RDF data)
        uses: actions/upload-artifact@v4
        with:
          name: kg-data
          path: |
            data/raw/
            data/csv/
            data/rdf/
            reports/
            schema/

      - name: Upload artifacts (text index)
        uses: actions/upload-artifact@v4
        with:
          name: kg-text-data
          path: |
            pubs/qlever_text/

      # Authenticate to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::050451359079:role/GitHubActionPushKGToECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build RDF-only image
      - name: Extract metadata (RDF-only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag || format('build-{0}', github.run_number) }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (RDF-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TEXT_INDEX=0

      # Build text-inclusive image
      - name: Extract metadata (text-inclusive)
        id: meta-text
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TEXT }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_TEXT }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag || format('build-{0}', github.run_number) }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (text-inclusive)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-text.outputs.tags }}
          labels: ${{ steps.meta-text.outputs.labels }}
          build-args: |
            TEXT_INDEX=1
