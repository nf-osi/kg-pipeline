name: Publish Evaluation Results

on:
  push:
    branches:
      - develop
    paths:
      - 'evaluation/runs.json'
      - 'evaluation/pubs_runs.json'
      - 'evaluation/main/dataset_attributes.yaml'
      - 'evaluation/main/eval_tools_ground_*.yaml'
      - 'evaluation/qa/qa_PMC*.yaml'
      - 'scripts/build_site.py'
      - 'scripts/site/**'
      - 'scripts/extract_runs.py'

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Build site
        run: |
          python scripts/build_site.py evaluation/runs.json \
            --pubs-json evaluation/pubs_runs.json \
            --out _site
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
