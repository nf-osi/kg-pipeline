# Upload RDF graph data to SageBrain S3 after a successful build.
# Implements the S3 upload step per:
#   https://github.com/Sage-Bionetworks-IT/sagebrain-infra#2-upload-data-to-s3
#
# Data is stored under a portal-scoped, date-partitioned prefix:
#   s3://<bucket>/{portal}/YYYY-MM-DD/schema/
#   s3://<bucket>/{portal}/YYYY-MM-DD/data/rdf/
#
# Runs as a separate workflow so upload failures never block Synapse archiving.
# Requires secret: SAGEBRAIN_ROLE_ARN (IAM role in sagebrain-prod for OIDC auth)
# Bucket name is stable (CDK-generated suffix) and set directly in NEPTUNE_BUCKET env var.

name: Upload to SageBrain S3

on:
  workflow_run:
    workflows: ["Build image"]
    types: [completed]

env:
  AWS_REGION: us-east-1
  NEPTUNE_BUCKET: app-prod-neptune-neptunedatabucketb8719d9a-jfo3bsfisgfn
  PORTAL: nf
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    # Tag pushes (the normal release path) are always trusted since they require
    # push access; workflow_dispatch runs are restricted to main/develop so ad hoc
    # test builds from feature branches can't overwrite the prod S3 prefix.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.event == 'push' ||
        (
          github.event.workflow_run.event == 'workflow_dispatch' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'develop'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Download RDF artifacts from build
        uses: actions/download-artifact@v7
        with:
          name: kg-data
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.SAGEBRAIN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate build manifest
        run: |
          DATE=$(date +%Y-%m-%d)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > manifest.ttl <<EOF
          @prefix rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
          @prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .
          @prefix prov: <http://www.w3.org/ns/prov#> .
          @prefix void: <http://rdfs.org/ns/void#> .
          @prefix nf:   <http://nf-osi.github.com/terms#> .

          nf:kgBuild_${{ github.event.workflow_run.id }}
              a prov:Activity, void:Dataset ;
              prov:generatedAtTime "$TIMESTAMP"^^xsd:dateTime ;
              prov:wasAssociatedWith <${{ github.event.workflow_run.html_url }}> ;
              prov:used <https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}> ;
              nf:portal "${{ env.PORTAL }}" ;
              nf:gitRef "${{ github.event.workflow_run.head_branch }}" ;
              nf:gitCommit "${{ github.event.workflow_run.head_sha }}" ;
              nf:buildRunId "${{ github.event.workflow_run.id }}" ;
              nf:buildTriggerEvent "${{ github.event.workflow_run.event }}" ;
              void:dataDump <s3://${{ env.NEPTUNE_BUCKET }}/${{ env.PORTAL }}/$DATE/> .
          EOF

      - name: Upload to S3
        # Uses sync --delete (not cp --recursive) so that if two builds run on the
        # same day, the second upload fully replaces the first, including files
        # removed/renamed since — cp alone would leave stale files behind.
        # Neptune loads the latest data for a given date.
        run: |
          DATE=$(date +%Y-%m-%d)
          PREFIX=s3://${{ env.NEPTUNE_BUCKET }}/${{ env.PORTAL }}/$DATE
          aws s3 sync schema/   $PREFIX/schema/   --delete
          aws s3 sync data/rdf/ $PREFIX/data/rdf/ --delete
          aws s3 cp manifest.ttl $PREFIX/manifest.ttl
