      datasets:
        synapse_id: syn50913342
        concrete_type: TableEntity
        note: Portal datasets with rich metadata (data type, species, assay, disease
          focus, access type, etc.); links to studies
        source_version: 16
      study_publications:
        synapse_id: syn16857542
        concrete_type: TableEntity
        note: Main portal publication listing (doi, pmid, title, journal, year, author,
          studyId); study-associated papers, keyed by DOI with a pmid-<id> fallback
        source_version: 6
        collection_name: MainPortalPublications
        collection_label: NF main portal publications
        collection_comment: 'Publications listed by the main NF Data Portal (Synapse
          project syn26451327) -- papers associated with portal STUDIES, carrying
          studyId, diseaseFocus and manifestation. This is a PARTIAL view of NF publications:
          tool- and resource-associated papers are maintained separately in NF Research
          Tools Central (syn26486839) as nf:ToolsCentralPublications. The two listings
          overlap, and because they are keyed differently (this one by DOI, Tools
          Central by an internal publicationId) the SAME paper can appear as two distinct
          biolink:Publication nodes. Deduplicate on pmid, doi or title before counting
          publications; do not treat a raw count of biolink:Publication as a count
          of distinct papers.'
      people:
        synapse_id: syn23564971
        concrete_type: TableEntity
        note: 'Portal people registry (ownerID, orcid, name, onProject). No longer
          Synapse-profile-only: 458 of 1518 rows are Synapse accounts, the rest are
          publication-derived researchers with an ORCID and a name but no ownerID.
          Supplies person nodes, their ORCID linkage, display names and project memberships.'
        source_version: 10
      publication_author_orcids:
        synapse_id: syn23564971
        concrete_type: TableEntity
        note: 'Per-publication author ORCID links (doi, orcid). Reads the SAME Synapse
          table as `people` but a different projection: the person''s `orcid` crossed
          with their `publications` DOI list, exploded to one (doi, orcid) row per
          pair in apply_derived_columns. Formerly its own table (syn76406574), which
          was deleted upstream once the people table absorbed the publication list.'
        source_version: 10
