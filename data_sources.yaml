        collection_name: ToolsCentralPublications
        collection_label: NF Research Tools Central publications
        collection_comment: 'Publications catalogued by NF Research Tools Central
          (Synapse project syn26338068) -- papers associated with research tools and
          resources, reachable from a resource via nf:Development. This is a PARTIAL
          view of NF publications on the portal: study-associated publications are
          maintained separately in the main portal listing (syn16857542, project syn26451327)
          and form their own collection. Do not assume this collection is every NF
          publication, and group or filter by prov:wasDerivedFrom when counting publications.'
