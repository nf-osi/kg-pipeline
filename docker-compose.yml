# QLever SPARQL endpoint for the NF knowledge graph.
#
# Usage (RDF only):
#   docker compose run --rm qlever-index        # build index
#   ./scripts/test_sparql.sh                    # start server, test, stop
#
# Usage (RDF + text):
#   docker compose run --rm qlever-index-text   # build index with text
#   ./scripts/test_sparql_with_text.sh          # start server, test, stop
#
# To rebuild after data changes, remove the volume first:
#   docker compose down -v

volumes:
  qlever-index:
  qlever-index-text:

services:
  qlever-index:
    image: adfreiburg/qlever
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sudo chown qlever:qlever /index &&
        cat /input/schema/ontology.ttl \
            $(ls /input/rdf/*.ttl | grep -v '\.rml\.ttl$$') \
          | qlever-index -F ttl -f - -i /index/kg --parse-parallel false
    volumes:
      - ./data/rdf:/input/rdf:ro
      - ./schema:/input/schema:ro
      - qlever-index:/index

  qlever-server:
    image: adfreiburg/qlever
    entrypoint: ["qlever-server"]
    command: ["-i", "/index/kg", "-p", "7001"]
    ports:
      - "7001:7001"
    volumes:
      - qlever-index:/index:ro

  qlever-index-text:
    image: adfreiburg/qlever
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sudo chown qlever:qlever /index &&
        cat /input/schema/ontology.ttl \
            /input/text/text_entities.ttl \
            $(ls /input/rdf/*.ttl | grep -v '\.rml\.ttl$$') \
          | qlever-index -F ttl -f - -i /index/kg --parse-parallel false \
              -w /input/text/wordsfile.tsv \
              -d /input/text/docsfile.tsv
    volumes:
      - ./data/rdf:/input/rdf:ro
      - ./schema:/input/schema:ro
      - ./pubs/qlever_text:/input/text:ro
      - qlever-index-text:/index

  qlever-server-text:
    image: adfreiburg/qlever
    entrypoint: ["qlever-server"]
    command: ["-i", "/index/kg", "-p", "7001", "-t"]
    ports:
      - "7001:7001"
    volumes:
      - qlever-index-text:/index:ro
