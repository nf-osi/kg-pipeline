# QLever SPARQL endpoint for the NF knowledge graph.
#
# This compose file uses the multi-stage Dockerfile to ensure parity
# between local development and production builds.
#
# Usage (RDF only):
#   docker compose build qlever-rdf             # build image with index
#   docker compose up qlever-rdf                # start server
#   ./scripts/test_sparql.sh                    # test
#
# Usage (RDF + text):
#   docker compose build qlever-text            # build image with text index
#   docker compose up qlever-text               # start server
#   ./scripts/test_sparql_with_text.sh          # test
#
# To rebuild after data changes:
#   docker compose build --no-cache qlever-rdf
#   # or
#   docker compose build --no-cache qlever-text

services:
  # RDF-only variant (no text search)
  qlever-rdf:
    build:
      context: .
      target: runtime-rdf
    ports:
      - "7001:7001"
    restart: unless-stopped

  # RDF + full-text search variant
  qlever-text:
    build:
      context: .
      target: runtime-text
    ports:
      - "7001:7001"
    restart: unless-stopped
