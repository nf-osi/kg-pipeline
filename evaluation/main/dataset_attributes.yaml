  - name: "Integrated Resource Queries"
    description: "Questions that integrate data across multiple resource types or with additional semantics"
    questions:
      - id: CR-001
        question: "Which cell lines have shown sensitivity to HDAC inhibitors?"
        user_story: "As a drug screening researcher, I want to identify cell lines with documented HDAC inhibitor sensitivity to select appropriate models for epigenetic therapy studies"
        level: advanced
        complexity: 1-hop
        facet_answerable: no
        facet_note: "HDAC inhibitor responses not available as filterable observations"
        text_search_answerable: partial
        text_search_note: "Can search for 'HDAC' or specific drug names, but cannot systematically identify all cell lines with documented sensitivity"
        user_frustration: high
        demo_priority: high
        demo_rationale: "Showcases Observations integration for practical drug discovery; addresses critical need for pre-validated screening models; HDAC inhibitors are promising epigenetic therapeutics for NF tumors"
        note: "Query observations.observationText for HDAC inhibitor terms (HDAC, histone deacetylase, valproic acid, vorinostat, PCI-24781, etc.) with evidence of sensitivity/response. Requires manual curation to distinguish sensitivity from resistance or neutral observations"

      - id: CR-002
        question: "Find human cell lines with the most diverse data types available on the portal."
        user_story: "As a bioinformatician, I want to identify the best-characterized cell lines across different assays to perform integrated multi-omics analysis."
        level: advanced
        complexity: 2-hop
        facet_answerable: no
        text_search_answerable: no
        user_frustration: very_high
        demo_priority: high
        demo_rationale: "Requires cross-resource aggregation and ranking; high value for multi-omics integration"
        note: "Requires using the modelSystemName attribute in Files to link to cell line, rank by dataType"

      - id: CR-003
        question: "Find animal models and cell lines that are derived from the same donor"
        user_story: "As a researcher, I want to find matched model systems (isogenic or same-donor) to compare in vitro and in vivo results"
        level: advanced
        complexity: 2-hop
        facet_answerable: no
        text_search_answerable: no
        user_frustration: very_high
        demo_priority: high
        demo_rationale: "Cross-resource matching, donor-based integration"

      - id: CR-004
        question: "Does the SZ-NF1 cell line require MTA? Please answer exactly: 'Yes', 'No', 'Not explicitly documented but likely', or 'Not explicitly documented so unlikely'"
        user_story: "As a researcher planning to acquire the SZ-NF1 cell line, I want to know whether I need to arrange an MTA before requesting materials"
        level: advanced
        complexity: 1-hop
        facet_answerable: no
        text_search_answerable: no
        user_frustration: moderate
        note: "Tests agent calibration on a specific cell line. SZ-NF1 has documented restrictions (IRB required, non-commercial use only, no chimeras, etc.) but no explicit MTA mention. The ontology notes MTAs are standard practice and absence of documentation should not be interpreted as not required. The agent must check usageRequirements, find no MTA, but recognize from other restrictions and ontology guidance that an MTA is likely."
        demo_priority: high
        demo_rationale: "Common practical question for material acquisition; tests overconfidence and hallucination"

  - name: "Study Discovery"
