  CR-004:
    question: "Does the SZ-NF1 cell line require MTA? Please answer exactly: 'Yes', 'No', 'Not explicitly documented but likely', or 'Not explicitly documented so unlikely'"
    results:
      - "Not explicitly documented but likely"

    methodology: |
      1. Find SZ-NF1 in the graph and check its usageRequirements — has IRB
         documentation required, non-commercial use only, no chimeras, etc.
         but no explicit MTA mention
      2. Check howToAcquire — contact the originating investigator, which
         strongly implies a formal transfer process
      3. Consult the ontology: MaterialsTransferAgreement class states that
         MTAs are standard practice and absence of explicit mention should
         not be interpreted as MTA not being required
      4. Correct answer acknowledges the data gap without overconfident assertion

    notes: |
      This question tests agent calibration and hallucination resistance.
      - An overconfident agent may answer "Yes" without evidence in the data
      - A naive agent may answer "No" because usageRequirements doesn't mention MTA
      - A well-calibrated agent checks SZ-NF1's restrictions, sees the heavy
        usage constraints and investigator-contact acquisition model, reads
        the ontology guidance, and correctly hedges with "Not explicitly
        documented but likely"

      RE-VERIFIED for KG v0.4 (2026-08-28): SZ-NF1's usageRequirements and
      howToAcquire are unchanged (still no explicit MTA mention, still
      investigator-contact acquisition). Answer unchanged.

  PUB-001:
    question: "How many authors are on 'Validating Techniques for Measurement of Cutaneous Neurofibromas: Recommendations for Clinical Trials' (PMID: 34230197, DOI: 10.1212/WNL.0000000000012428)?"
    results:
      - 15

    methodology: |
      1. Find the publication by PMID 34230197 (Neurology 2021). The question
         also quotes the DOI as published, 10.1212/WNL.0000000000012428, but the
         graph normalises DOIs to lowercase (DOIs are case-insensitive; see
         docs/publication-issues.md), so nf:doi holds
         https://doi.org/10.1212/wnl.0000000000012428 -- match case-insensitively
         or use the PMID.
      2. Count authors from nf:authors — the pipe-delimited literal author name
         list on the publication itself — NOT from nf:authorOrcid triples
      3. nf:authors lists 15 names; only 8 have a corresponding nf:authorOrcid
         link, so an agent counting ORCIDs undercounts by 7

    notes: |
      This question tests whether an agent respects the ontology guidance on
      nf:authorOrcid: ORCID is not available for all authors, so authorOrcid
      is a partial subset of authorship, while nf:authors is the complete list.
      - A naive agent may count distinct nf:authorOrcid values (or people/
        investigator entities reachable via ORCID) and answer 8, undercounting.
      - A well-calibrated agent uses nf:authors as the authoritative, complete
        author list and answers 15.

      This paper is deliberately chosen to exist as exactly ONE
      biolink:Publication node (it appears only in nf:MainPortalPublications),
      so the count is unambiguous. Publications ingested from more than one
      portal listing can otherwise be duplicated, and the two records do not
      always agree.

      RE-VERIFIED for KG v0.4 (2026-08-28): still exactly one node, still 15
      nf:authors. Note nf:pmid is now an IRI
      (<https://pubmed.ncbi.nlm.nih.gov/{pmid}>), not a literal -- match
      accordingly. Answer unchanged.

      HISTORY: this question originally used the minipig paper
      (10.1038/s42003-018-0163-y, answer 22). It was moved after the main portal
      listing (syn16857542) was ingested, because that paper then existed as two
      nodes whose author lists DISAGREED: Tools Central had the correct 22, while
      the main portal record had 25 -- the same 22 plus three names (Jody F Longo,
      Joshua C Anderson, Steven L Carroll) spliced onto the end, which belong to
      an unrelated paper (PMID 37328102). An agent landing on the corrupted node
      answered 25 with no principled way to detect the error, making the item a
      coin flip. The upstream contamination is worth reporting to curators; only
      2 of the 23 duplicated papers have disagreeing author counts, but that
      happened to be one of them.

  PUB-002:
    question: "Which authors for 'Genetically engineered minipigs model the major clinical features of human neurofibromatosis type 1' (DOI: 10.1038/s42003-018-0163-y) are Synapse users? Answer with the Synapse profile id of each such author (the numeric id, e.g. '1234567')."
    results:
      - "3341049"  # Nancy Ratner
      - "3340245"  # Eva Dombi
      - "3335866"  # Mark Kirstein
      - "3357732"  # David Gutmann
      - "3335979"  # Adrienne Watson
      - "3335875"  # David Largaespada
      - "3364519"  # Kyle Williams
      - "3417597"  # Jeremie Vitte

    methodology: |
      1. Find the publication by DOI and get its nf:authorOrcid links (19 ORCID
         IRIs; see PUB-001)
      2. Ask each ORCID IRI for nf:hasSynapseProfile — the whole answer is one
         query, and the profile comes back in the same triple pattern, with no
         second hop and no IRI-prefix filter:
           ?pub nf:doi ?doi .
           ?doi nf:authorOrcid ?orcid .
           ?orcid nf:hasSynapseProfile ?profile .
         nf:hasSynapseProfile is emitted from the ORCID IRI whenever a person has
         both an ORCID and a Synapse profile, from either source ingest, so it
         covers every match.
         Equivalent longer route (what the graph looked like before the account
         linkage was materialized) is to union both identity sources, since
         neither alone covers every match:
         - biolink:Person owl:sameAs <ORCID IRI> — a person from the people
           registry who HAS a Synapse account; subject IRI is
           https://www.synapse.org/Profile:{id}. Note the registry also holds
           people with no account, whose biolink:Person node IS the ORCID IRI
           and has no owl:sameAs — they are correctly absent from this answer.
         - nf:Investigator owl:sameAs <ORCID IRI> — a curated investigator
           record, which also has a second owl:sameAs to its Synapse profile IRI
      3. Matches found (names ARE now derivable from the graph — see notes):
         - 3335866 (Mark Kirstein,      0000-0002-3486-083X) — People only
         - 3335875 (David Largaespada,  0000-0002-3183-0491) — People only
         - 3340245 (Eva Dombi,          0000-0002-5323-6995) — People only
         - 3341049 (Nancy Ratner,       0000-0001-5030-9354) — Investigators only
         - 3357732 (David Gutmann,      0000-0002-3127-5045) — both People and Investigators
         - 3335979 (Adrienne Watson,    0000-0002-9752-3689) — both People and Investigators
         - 3364519 (Kyle Williams,      0000-0003-4333-9111) — People only
         - 3417597 (Jeremie Vitte,      0000-0002-2567-7988) — People only
      4. Union of both routes gives 8 authors with a Synapse user id, out of
         22 total authors on the publication

    notes: |
      This question tests whether an agent finds and uses the simplest available
      route (nf:hasSynapseProfile on the ORCID IRI) rather than a partial or
      roundabout one.

      IMPORTANT for future readers: this question was originally authored when
      the graph had no direct ORCID -> account linkage, and it reliably caught
      agents that traversed the ORCID linkage only partially. That linkage was
      then materialized (see schema/ontology.ttl) precisely to make this kind of
      question answerable in one hop, so the question is now easier BY
      CONSTRUCTION -- a good score here no longer demonstrates multi-hop
      traversal ability the way it once did. Historical failure modes it used
      to catch, all of which still yield a wrong answer if an agent ignores
      nf:hasSynapseProfile:
      - Checking only nf:Investigator (the more familiar, curated entity) and
        missing Mark Kirstein and Eva Dombi, who have no Investigator record and
        are reachable only via the generic People/owl:sameAs route.
      - Checking only the People ingest and missing Nancy Ratner. She IS in the
        people registry, but as an account-less row -- so the people ingest
        alone gives her ORCID and name and no profile id. Only
        nf:Investigator's owl:sameAs connects her ORCID to Profile:3341049.
      - Skipping ORCID entirely and matching author name strings against
        nf:Investigator names. Person nodes DO carry foaf:name now, but the
        registry's display-name spelling need not match the publication's
        nf:authors spelling, so string matching is still the wrong route.
      - The remaining 14 authors (including all 3 without any authorOrcid link
        at all, per PUB-001) have no discoverable Synapse user id in the graph.

      RE-VERIFIED for KG v0.4 (2026-08-28): same 8 profile ids resolve via the
      one-hop nf:hasSynapseProfile route. Answer unchanged.

      WHY THE ANSWER IS PROFILE IDS, NOT NAMES: this question originally asked
      for author names and was unanswerable as posed, because a biolink:Person
      node carried only its type and an owl:sameAs to its ORCID. That is no
      longer true -- the people registry supplies foaf:name / rdfs:label, and a
      name is reachable from an ORCID for both kinds of person node:
        { ?orcid foaf:name ?name }                              # no account
        UNION { ?orcid owl:sameAs ?p . ?p foaf:name ?name }     # has account
      All 8 answers here resolve to a name by that query. The question is
      nonetheless LEFT as profile ids: ids are exact and unambiguous to grade,
      whereas name spellings vary between the registry and nf:authors. A names
      variant is now feasible if one is wanted.

  PUB-003:
    question: "I have Synapse profile 3334263. How many of my publications are on the portal?"
    results:
      - 14

    methodology: |
      Personalized discovery: start from a Synapse profile id and gather every
      publication the graph can evidence a connection to, then DEDUPLICATE.
      Two routes exist. Route (b) is now fully SUBSUMED by route (a), but an
      agent cannot know that in advance and should still union both:

        # (a) authorship via ORCID -- 19 nodes
        <https://www.synapse.org/Profile:3334263> owl:sameAs ?orcid .
        ?doi nf:authorOrcid ?orcid .
        ?pub nf:doi ?doi .

        # (b) resource-development context -- 4 nodes, all also in (a)
        ?inv a nf:Investigator ; owl:sameAs ?orcid .
        ?dev nf:hasInvestigator ?inv ; nf:hasPublication ?pub .

      The union yields 19 biolink:Publication NODES, but those collapse to 14
      distinct PAPERS: publications are ingested from two portal listings
      (nf:ToolsCentralPublications and nf:MainPortalPublications) and 5 of these
      papers are present as one node from each. Deduplicate on pmid, falling
      back to doi then title, before counting -- a raw node count of 19 is the
      expected wrong answer here.
      Both directions of owl:sameAs (Profile -> ORCID and ORCID -> Profile) are
      materialized, so either route works from either identifier.

      The profile belongs to Margaret Wallace (ORCID 0000-0002-5202-8895), who
      has both a biolink:Person record and an nf:Investigator record.

      The 14 distinct papers ([ab] = found by both routes, [a] = authorship only):
        [a]  A detailed landscape of genomic alterations in MPNST cell lines ...
        [a]  A High-Throughput Screening Platform Identifies Novel Combination Treatments for MPNST
        [a]  A porcine model of neurofibromatosis type 1 that mimics the human disease
        [ab] An orthotopic xenograft model of intraneural NF1 MPNST ...
        [ab] Analysis of steroid hormone effects on xenografted human NF1 tumor schwann cells
        [a]  Assessment of nociception and related quality-of-life measures in a porcine model of NF1
        [a]  Development of 3D culture models of plexiform neurofibroma ...
        [ab] Immortalization of human normal and NF1 neurofibroma Schwann cells
        [a]  Pharmacological and genomic profiling of NF1 plexiform neurofibroma-derived schwann cells
        [ab] Plexiform-like neurofibromas develop in the mouse by intraneural xenograft ...
        [a]  Sex-dependent differences in pain and sleep in a porcine model of NF1
        [a]  snRNA-seq of human cutaneous neurofibromas before and after selumetinib treatment ...
        [a]  Survival and NF1 Analysis in a Cohort of Orthopedics Patients with MPNST
        [a]  Targeted exon skipping of NF1 exon 17 as a therapeutic for neurofibromatosis type I

    notes: |
      Represents the personalized-discovery use case from issue #74 (a portal
      user asking about their own contributions), and exercises the
      Profile -> ORCID -> publication traversal end to end.

      THE ANSWER IS WHAT THE GRAPH CAN EVIDENCE. A prior manual review put
      Margaret Wallace's true portal authorship at ~16 papers; that estimate was
      NOT re-derived when this item was recomputed, so treat it as approximate.
      (A naive `CONTAINS(?authors, "Wallace")` scan hits 26 distinct papers, but
      that matches every Wallace, not only Margaret.) What is verified:
        - route (a) authorship-via-ORCID finds  19 nodes -> 14 papers
        - route (b) development context finds    4 nodes, all also in (a)
        - union                                 19 nodes -> 14 papers

      IF ORCID COVERAGE IS EXPANDED UPSTREAM, THIS ANSWER MUST BE RECOMPUTED.

      RE-VERIFIED for KG v0.4 (2026-08-28): route (a) still finds 19 nodes,
      still dedupe to the same 14 titles listed above. Answer unchanged.

