ground_truth:
  AM-004:
    question: "Find mouse model with the earliest observed tumor development"
    results:
      # Single earliest at 90 days (3 months) -- see notes, re-derived for KG v0.4
      - 9971e47e-976a-4631-8edd-5cae04304b01  # Nf1+/-GFAPCKO

    methodology: |
      Review observations for:
      1. Mouse models only (nf:species = "Mus musculus" on the nf:AnimalModel)
      2. nf:PhenotypeObservation instances whose text describes an actual tumor
         (search text for tumor/neurofibroma/sarcoma/glioma/mpnst; observationType
         is no longer a literal string in KG v0.4 -- Observation subclass
         (AssayObservation, PhenotypeObservation, ...) plus free text is the
         only way to identify a tumor-relevant observation now)
      3. Actual tumor detection (not genetic manipulation timing, drug-treatment
         timing, survival/endpoint metrics, or negative results)
      4. Earliest observationTime (normalize units: 1 month = 30 days)

      Interpret observation text carefully -- most tumor-mentioning observations
      don't describe detection timing. For example, exclude:
      - "at embryonic day" / "at E12.5" (genetic manipulation timing, not detection)
      - "prior to" / "before" (pre-tumor observations)
      - "no evidence" / "did not develop" (negative results)
      - text describing when a *treatment* started or was withdrawn (a
        prevention/intervention timepoint, not a detection timepoint) --
        e.g. "treatment ... starting at 1 month of age prevented initiation of ..."
      - "median survival of N days" (a mortality endpoint, not first-observed
        tumor timing -- treated as not dispositive; see notes)

    observations:
      - resourceId: 9971e47e-976a-4631-8edd-5cae04304b01
        resourceName: "Nf1+/-GFAPCKO"
        observationTime: 3.0
        observationTimeUnits: "months"
        observationSubmitterName: "James Goss"
        observationText: "Optic glioma, focal expansion of prechiasmatic optic nerves and chiasm. Low proliferative indices. Lack of eosinophilic granular bodies, Rosenthal fibers or microcystic structures commonly seen in humans (therefore not juvenile pilocytic astrocytomas). Decrease in IPL-GCL and RNFL thickness by SD-OCT"

    notes: |
      RE-DERIVED for KG v0.4 (2026-08-28) -- the answer CHANGED, and not because
      of the resourceId/schema migration itself. A large batch of new,
      LLM-extracted observations was ingested (submitter "🤖 AI-extracted[
      - IN BETA - please confirm accuracy in linked publication]"), which
      surfaced a genuine earlier tumor-detection record that did not exist in
      the v0.2-eval snapshot: Nf1+/-GFAPCKO, an optic glioma detected at 3
      months (90 days) of age, submitted by a named human curator (James Goss),
      not the AI-extraction pipeline.

      This supersedes the previous tied answer at 120 days (4 months):
      - 215b4e43-8a99-4702-ab4b-eeeadeeb13a5 (Nf1flox/flox;PostnCre(+))
      - eb4aff73-9da2-42b5-8f94-0a6084db75b0 (Nf14F/4F; DhhCre)
      Both of those 120-day observations are still present, unchanged, and
      still valid data -- they are simply no longer the earliest.

      Judgment call worth flagging: fbf11ec4-1d12-4feb-a6fc-9faf6bc9c9db
      (Nf1flox/-;hGFAP-Cre) has an AI-extracted observation reading "resulted
      in tumor formation with a median survival of 91 days" (also earlier than
      120). Treated as NOT a valid detection timepoint -- median survival is a
      mortality endpoint that post-dates actual tumor onset by an unknown
      margin, so it doesn't establish "earliest observed tumor development."
      Even if this judgment is wrong, 91 > 90, so it would not change the
      winner. Also excluded: four "3 months"/"90 days" observations reporting
      explicitly NEGATIVE optic glioma findings ("no evidence of optic glioma
      formation") on other Cx3cr1/NG2-Cre models, and two "12.5 days" entries
      that describe embryonic Cre-recombination timing (~E12.5), not tumor
      detection.

      Because this depends on newly-ingested, partly AI-extracted observation
      text rather than a stable structured field, it is worth spot-checking
      again once the AI-extracted observations move out of beta.

  CL-003:
    question: "I need normal schwann cell lines"
    results:
      - 13ae2445-21e3-4b75-ae70-317a3d5ee40c  # hTERT SC ipn97.4
      - 3a507bfd-7d2b-4238-b79a-83fe985c2cea  # hTERT ipn02.3 2λ
      - 3a8f5be4-aa22-48f2-9a76-9412010ecd45  # hTERT ipn02.8
      - b751b5d4-56e6-42a2-a2dc-289f90c6dd82  # ScienCell Schwann cells

    methodology: |
      "Normal" Schwann cell lines must satisfy all of:
      1. Identified as Schwann cells via name, description, or synonyms
         (includes "schwann" or the abbreviation "hTERT SC" = Schwann Cell)
      2. geneticDisorder = "No known genetic disorder"
      3. Not a schwannoma (tumor-derived) line
      4. Not an NF1 knockout or engineered mutant (e.g. NF1 -/-)
      5. Cell line category consistent with "normal" — finite or telomerase
         immortalized lines qualify; cancer, transformed, iPSC, embryonic stem,
         hybridoma, hybrid, and spontaneously immortalized lines do not

    notes: |
      RE-VERIFIED for KG v0.4 (2026-08-28): re-ran the methodology against
      current data. Answer set UNCHANGED -- same 4 cell lines, no new
      qualifying or disqualified candidates (checked against a fresh
      name/synonym/description sweep for "schwann"/"hTERT SC", including a
      newly-added entry "i28cNF" which correctly excludes on
      geneticDisorder = NF1).

      Of the 5 corrections previously recommended below, 4 have been fixed
      upstream (geneticDisorder now correctly reads "Neurofibromatosis type 1"
      for all four NF1-knockout/rescue lines). Still open:
