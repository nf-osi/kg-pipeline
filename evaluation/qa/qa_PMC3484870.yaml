- id: PMC3484870-09
  pmcid: PMC3484870
  author: claude-opus-4-6
  question: What melanophore phenotype is observed in nf1-null zebrafish larvae, and what is its significance?
  user_query: melanophore phenotype in nf1 null zebrafish larvae whats the significance
  ideal: nf1-null larvae display a significant reduction in lateral stripe melanophore numbers at 6 dpf, with disruption of
    the normally uniform melanophore pattern. This phenotype is first appreciable at 4 dpf and is attributed to defects in
    migration or differentiation of regeneration and metamorphic lineage melanophores (not embryonic melanophores). This represents
    the first vertebrate animal model of the pathognomonic pigmentation lesions (cafe-au-lait spots) associated with human
    NF1.
  choices:
  - Reduced lateral stripe melanophores at 6 dpf due to defects in regeneration/metamorphic melanophore lineages, representing
    the first vertebrate model of NF1 cafe-au-lait-like pigmentation defects
  - Increased melanophore numbers along the lateral stripes causing hyperpigmentation, modeling the neurofibromas seen in
    NF1 patients
  - Complete absence of all melanophores throughout the body by 3 dpf due to failure of neural crest cell specification
  - Not in knowledgebase
