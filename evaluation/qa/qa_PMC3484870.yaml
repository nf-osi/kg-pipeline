- id: PMC3484870-08
  pmcid: PMC3484870
  author: claude-opus-4-6
  question: Why do the authors argue that zebrafish nf1a and nf1b have redundant functions, and what is the evidence from
    both embryonic development and tumorigenesis?
  user_query: evidence for nf1a nf1b redundancy in zebrafish development and cancer
  ideal: In embryonic development, homozygous loss of either nf1a or nf1b alone produces viable, fertile, phenotypically normal
    animals, whereas combined loss of both genes (nf1a-/-; nf1b-/-) results in larval lethality, OPC/Schwann cell hyperplasia,
    myelination defects, melanophore defects, and motor/learning deficits. A single wild-type allele of either gene is sufficient
    for normal development. Similarly in tumorigenesis, neither nf1a nor nf1b homozygous loss alone (even over 18 months)
    produced tumors, whereas nf1a+/-; nf1b-/-; p53e7/e7 animals showed accelerated and highly penetrant gliomas and MPNSTs
    compared to nf1a+/+; nf1b-/-; p53e7/e7 animals. Western blot analysis showed that pERK1/2 was elevated only in double-homozygous
    null larvae, not in single-gene homozygous mutants, further supporting functional redundancy.
  choices:
  - Single-gene homozygous mutants are normal and viable; only combined loss produces developmental defects, lethality, and
    accelerated tumorigenesis, with pERK1/2 elevated only in double-null larvae
  - Both nf1a and nf1b single homozygous mutants show partial phenotypes that become more severe when combined, indicating
    additive rather than redundant functions
  - Redundancy is demonstrated by the fact that nf1a-/- and nf1b-/- single mutants both develop tumors independently at similar
    rates
  - Not in knowledgebase
