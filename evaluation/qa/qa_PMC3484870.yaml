  author: claude-opus-4-6
  question: Why does the loss of nf1a and nf1b lead to OPC hyperplasia in zebrafish larvae?
  user_query: why do nf1 knockout zebrafish get OPC hyperplasia
  ideal: Loss of nf1a and nf1b leads to OPC hyperplasia because neurofibromin normally suppresses the proliferation of OPCs.
    Increased BrdU incorporation in nf1-null OPCs at 4 and 5 dpf demonstrates that increased proliferation, rather than altered
    specification, drives the expansion of OPCs.
  choices:
  - Because neurofibromin normally suppresses OPC proliferation, and its loss leads to increased OPC proliferation as shown
    by BrdU incorporation at 4 and 5 dpf
  - Because nf1 loss increases the initial specification of OPCs at 2 dpf, leading to greater numbers from the start of development
  - Because nf1 loss causes decreased OPC apoptosis rather than increased proliferation
