- id: PMC7305302-06
  pmcid: PMC7305302
  author: gpt-5.4
  question: What major research bottleneck in NF1 nerve sheath tumor therapy development
    was the Johns Hopkins biospecimen repository designed to overcome, and how was
    the repository structured to address it?
  user_query: what problem was nf1 jhu biobank trying to fix, and what did they build
    to fix it
  ideal: The repository was designed to overcome the lack of access to primary human
    NF1 tumor tissue and the limited availability of relevant model systems, which
    had slowed development of new therapies, especially nonsurgical options for plexiform
    neurofibromas. To address this, it banked blood fractions and multiple NF1-associated
    tumor types, generated patient-derived cell lines and xenografts, linked each
    sample to clinical annotation, produced genomic and transcriptomic data, and shared
    these resources through the NF Data Portal and Synapse.
  choices:
  - A shortage of primary human NF1 tumor tissue and validated models; the repository
    banks multiple NF1 tumor and blood specimens, generates cell lines and xenografts,
    adds clinical/genomic/transcriptomic annotation, and shares data publicly
  - A shortage of data to map genomic and epigenomic evolution in NF1 tumors, leading
    the repository to increase and share data available from single-cell and spatial
    technologies, especially for plexiform neurofibromas
  - Poor public availability of histopathology and MRI data for NF1 patients; the
    repository hugely expands imaging modality data alongside genomic data and model
    systems and shares data publicly
  - Not in knowledgebase
