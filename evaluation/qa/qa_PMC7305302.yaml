- id: PMC7305302-07
  pmcid: PMC7305302
  author: gpt-5.4
  question: How did the scale of the initial public data release from the Johns Hopkins
    NF1 biospecimen repository compare with the RNA-seq dataset after quality control
    and with the planned second cohort?
  user_query: how big was the first jhu nf1 data release, how many rna-seq samples
    survived qc, and what's coming next
  ideal: The initial release contained genomic and transcriptomic data from 55 tumor
    samples derived from 23 individuals. After RNA-seq quality control, one highly
    duplicated sample was removed, leaving 28 RNA-seq samples. A second cohort was
    reported to be undergoing sequencing, with exome sequencing for 51 samples and
    RNA sequencing for 28 additional samples.
  choices:
  - 'Initial release: 23 tumor samples from 55 patients; 51 RNA-seq samples remained
    after QC; second cohort: 28 exomes only'
  - 'Initial release: 55 tumor samples from 23 individuals; 28 RNA-seq samples remained
    after QC; second cohort included exome sequencing for 51 samples and RNA sequencing
    for 28 additional samples'
  - 'Initial release: 28 tumors from 23 individuals; no RNA-seq samples passed QC;
    second cohort details were not reported'
