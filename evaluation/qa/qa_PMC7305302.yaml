- id: PMC7305302-07
  pmcid: PMC7305302
  author: gpt-5.4
  question: What major research bottleneck in NF1 nerve sheath tumor therapy development was the Johns Hopkins biospecimen
    repository designed to overcome, and how was the repository structured to address it?
  user_query: what problem was this nf1 biobank trying to fix, and what did they build to fix it
  ideal: The repository was designed to overcome the lack of access to primary human NF1 tumor tissue and the limited availability
    of relevant model systems, which had slowed development of new therapies, especially nonsurgical options for plexiform
    neurofibromas. To address this, it banked blood fractions and multiple NF1-associated tumor types, generated patient-derived
    cell lines and xenografts, linked each sample to clinical annotation, produced genomic and transcriptomic data, and shared
    these resources through the NF Data Portal and Synapse.
  choices:
  - A shortage of primary human NF1 tumor tissue and validated models; the repository banks multiple NF1 tumor and blood specimens,
    generates cell lines and xenografts, adds clinical/genomic/transcriptomic annotation, and shares data publicly
  - A lack of bacterial culture methods for NF1 skin lesions; the repository therefore focused on microbial sequencing of
    skin swabs only
  - Poor MRI availability for NF1 patients; the repository therefore stored imaging files but no tissue or model systems
  - Not in knowledgebase
  correct_choice_index: 0
  passage_indices: [1, 4, 5, 8, 9, 50]
  difficulty: hard
  question_type: causal
