- id: PMC7305302-05
  pmcid: PMC7305302
  author: gpt-5.4
  question: What evidence was used to show that JHU patient-derived cell lines and
    xenografts preserved the genomic features of the original NF1-associated tumors?
  user_query: what proof jhu cell lines and pdxs still matched the original tumors
    genomically
  ideal: They compared exome-seq mutational profiles of commonly mutated genes between
    the original tumor and the derived models, and they also compared copy-ratio alterations.
    In patient 2-031, the reduction in copy ratio near the NF1 locus on chromosome
    17 seen in the tumor was preserved in the derived cell line and xenograft, supporting
    genetic fidelity.
  choices:
  - Only similarity in gross tumor size between patients and mice was used
  - Matching exome mutation profiles plus preserved copy-ratio alterations, including
    reduced copy ratio near the NF1 locus on chromosome 17 in patient 2-031 across
    tumor, cell line, and xenograft
  - Shared RNA contamination signatures and identical blood counts were used as the
    main evidence
