- id: PMC7305302-05
  pmcid: PMC7305302
  author: gpt-5.4
  question: How were surgically resected NF1-associated tumors processed for preservation and quality control before banking
    in the repository?
  user_query: how did they store/qc the tumor pieces before banking
  ideal: After resection, specimens were sent immediately to surgical pathology for inspection to confirm adequate tumor tissue
    for diagnosis. Approved tissue was transported to the lab, cut into 5-10 mm aliquots under sterile conditions, and preserved
    in neutral buffered formalin, cell freezing medium, and/or by snap-freezing on dry ice. For pathologically heterogeneous
    tumors, aliquots were embedded in O.C.T., sectioned, and a slide from each aliquot was reviewed by the study pathologist
    to confirm histologic diagnosis, tissue representation, and quality.
  choices:
  - Specimens were fixed only as paraffin blocks with no pathology review before banking
  - Tumors were enzymatically digested immediately and all aliquots were frozen without histologic confirmation
  - After immediate pathology inspection, tumor was cut into 5-10 mm aliquots, preserved in formalin, freezing medium, or
    by snap-freezing, and sectioned/O.C.T. slides were reviewed to confirm histology and quality
  - Not in knowledgebase
  correct_choice_index: 2
  passage_indices: [17, 18, 19]
  difficulty: medium
  question_type: methodological
