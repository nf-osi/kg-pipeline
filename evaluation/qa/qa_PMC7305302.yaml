- id: PMC7305302-03
  pmcid: PMC7305302
  author: gpt-5.4
  question: In the Johns Hopkins NF1 biospecimen repository, what animals and implantation
    strategy were used to generate patient-derived xenografts (PDX), and what overall
    success rate was reported for attempted malignant peripheral nerve sheath tumor
    (MPNST) PDX generation?
  user_query: what mice did they use for the jhu nf1 pdx models and how well did mpnsts
    take
  ideal: PDX models were generated in adult NOD scid gamma mice. Tumor pieces about
    2-3 mm were dipped in ice-cold Matrigel and implanted into the flank, pre-tibial
    space, or pre-sacral space. The reported overall success rate for attempted MPNST
    PDX generation was 50%.
  choices:
  - Adult NOD scid gamma mice; 2-3 mm tumor fragments dipped in ice-cold Matrigel
    and implanted into the flank, pre-tibial, or pre-sacral sites; MPNST PDX success
    was 50%
  - BALB/c nude mice; dissociated cells injected intravenously; MPNST PDX success
    was 90%
  - C57BL/6 mice; fragments implanted only intracranially; pNF PDX success was 50%
