- id: PMC7305302-02
  pmcid: PMC7305302
  author: gpt-5.4
  question: How were patients with NF1 identified and enrolled for the Johns Hopkins
    biospecimen repository, and what clinical information was recorded after tumor
    collection?
  user_query: how did they recruit the nf1 patients for jhu biobank and what info
    did they save from charts
  ideal: Patients were identified when they were scheduled for a clinically indicated
    resection or biopsy of an NF1-associated tumor, based on surgical schedule review
    and communication from the clinical team. After eligibility review, written informed
    consent was obtained, and blood was collected from most patients on the day of
    surgery. After tumor collection, the medical record was reviewed for demographics,
    NF1 diagnosis details such as genomic findings, family history and age at diagnosis,
    phenotypic findings and symptoms, and tumor burden including number and size of
    NF1-associated tumors.
  choices:
  - By identifying patients undergoing clinically indicated NF1-associated tumor resection
    or biopsy, obtaining written consent, usually collecting blood on the surgery
    day, and abstracting demographics, NF1 history, phenotype, symptoms, and tumor
    burden from medical records
  - By recruiting only patients with recurrent metastatic MPNST through a national
    registry and collecting saliva after chemotherapy
  - By screening healthy relatives for germline NF1 variants without surgery or chart
    review
  - Not in knowledgebase
