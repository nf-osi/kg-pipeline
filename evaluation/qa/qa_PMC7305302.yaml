  question: What evidence was used to show that patient-derived cell lines and xenografts preserved the genomic features of
    the original NF1-associated tumors?
  user_query: how did they prove the cell lines and pdxs still matched the original tumors genomically
  ideal: They compared exome-seq mutational profiles of commonly mutated genes between the original tumor and the derived
    models, and they also compared copy-ratio alterations. In patient 2-031, the reduction in copy ratio near the NF1 locus
