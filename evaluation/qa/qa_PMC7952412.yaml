  question: What is the mutational and functional status of the NF1 gene in the sporadic
    malignant peripheral nerve sheath tumor cell line 2XSB?
  user_query: is NF1 mutated in 2XSB cells?
  ideal: The 2XSB cell line has intact, functional NF1 alleles and expresses functional
    full-length neurofibromin protein, distinguishing it from many NF1-associated
    MPNSTs.
  choices:
