  author: gemini-3.1-pro-preview
  question: Which previously unassociated genes were identified as having pathogenic
    or likely pathogenic mutations in the sporadic MPNST cell line 2XSB?
  user_query: what new mutated genes were found in 2xsb that weren't linked to mpnst
    before
  ideal: Whole exome sequencing of 2XSB cells revealed pathogenic or likely pathogenic
    mutations in several genes not previously associated with MPNST pathogenesis,
    including DNMT1, NUMA1, NTRK1, PDE11A, CSMD3, LRP5, and ACTL9.
  choices:
  - DNMT1, NUMA1, NTRK1, PDE11A, CSMD3, LRP5, and ACTL9.
  - SUZ12, EED, EZH1, and EZH2.
  - Not in knowledgebase.
  - BRD4, BIRC5, COX2, EGFR, and HIF1A.
