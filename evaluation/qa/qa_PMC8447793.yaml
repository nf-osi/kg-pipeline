  question: How does the phenotypic effect of globally inhibiting R-Ras signaling via a dominant negative mutant contrast
    with the inhibition of classic Ras signaling via dominant negative H-Ras in MPNST cells?
  user_query: difference between DN R-Ras and DN H-Ras in MPNST
