  question: In the bioinformatics analysis of the small RNAseq data, how was the normalization of sequence counts achieved
    for each sample?
  user_query: how did they normalize the rna seq counts in the asd mirna study?
  ideal: Normalization was achieved by dividing the sequence counts by a library size parameter for the corresponding sample,
    which is the median value of the ratio between the counts of a specific sample and a pseudo-reference sample.
  choices:
  - By dividing the sequence counts by a library size parameter of the corresponding sample.
  - Not in knowledgebase
  - By applying a log2 transformation followed by quantile normalization across all samples.
  - By normalizing the counts to the expression of housekeeping genes like GAPDH and HPRT.
  correct_choice_index: 0
