  question: What was the frequency of homozygous CDKN2A/B deletions in oligosarcomas
    compared to their primary lesions, and was the difference statistically significant?
  user_query: CDKN2A deletion rate in oligosarcomas vs primary tumors
  ideal: CDKN2A/B locus deletions were present in 83% (20/24) of oligosarcomas compared
    to 25% (3/12) of primary lesions, a statistically significant increase (p = 0.000593,
    chi-square). Of the oligosarcoma deletions, 63% (15/24) were homozygous.
