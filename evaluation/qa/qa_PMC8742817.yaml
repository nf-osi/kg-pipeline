  question: What immunohistochemical changes distinguish oligosarcomas from their
    precursor oligodendrogliomas with respect to p53, H3K27me3, and OLIG2?
  user_query: IHC differences oligosarcoma vs precursor - p53 H3K27me3 OLIG2
  ideal: Oligosarcomas showed accumulation of p53 (11/12, 91.7%) which was absent
    in primary oligodendrogliomas; re-gain of H3K27me3 expression (10/11, 90.9%) which
    was lost in primary oligodendrogliomas (0/4 positive); and loss of OLIG2 (13/14
    negative) whereas all primary tumors were OLIG2 positive.
  choices:
  - Oligosarcomas gained p53 accumulation, regained H3K27me3, and lost OLIG2 compared
    to precursors
  - Oligosarcomas lost p53, lost H3K27me3, and gained OLIG2 compared to precursors
  - Oligosarcomas showed no change in p53 but gained H3K27me3 and retained OLIG2
