  question: Based on the evidence presented, what diagnostic criteria can be used
    to establish a diagnosis of oligosarcoma?
  user_query: how do you diagnose oligosarcoma
  ideal: The diagnosis can be based on the combined presence of (a) sarcomatous histology,
    (b) IDH mutation, and (c) TERT promoter mutation and/or 1p/19q codeletion. In
    unresolved cases, the characteristic DNA methylation profile can be used for diagnosis.
  choices:
  - Sarcomatous histology + IDH mutation + TERT promoter mutation and/or 1p/19q codeletion;
    or characteristic DNA methylation profile
  - ATRX loss + IDH mutation + CDKN2A deletion
  - p53 accumulation + NF1 loss + YAP1 overexpression
