  question: How did NF1 and YAP1 protein expression differ between oligosarcomas and
    conventional oligodendrogliomas as assessed by immunohistochemistry?
  user_query: NF1 and YAP1 expression oligosarcoma vs oligodendroglioma
  ideal: In oligosarcomas, 7/11 (63.6%) showed tumor cell-specific loss of NF1 expression,
    while NF1 was retained in all primary lesions (9/9) and in 20/20 reference oligodendrogliomas.
    YAP1 was strongly positive in 10/11 (91%) oligosarcomas, while only 1/20 (5%)
    conventional oligodendrogliomas showed YAP1 staining with only a subset of cells
    positive.
