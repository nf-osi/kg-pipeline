  question: What was the median overall survival after occurrence of oligosarcoma,
    and how did survival of patients with oligosarcoma as first recurrence compare
    to patients with grade 3 oligodendroglioma as first recurrence?
  user_query: survival oligosarcoma patients vs grade 3 oligo recurrence
  ideal: The median overall survival after occurrence of oligosarcoma was 2.5 years,
    and for patients with oligosarcoma as first recurrence it was 1.8 years. Survival
    was highly significantly poorer for oligosarcoma as first recurrence compared
    to conventional grade 3 oligodendroglioma as first recurrence (p = 0.0038).
  choices:
  - Median OS after oligosarcoma was 2.5 years; oligosarcoma as first recurrence had
    significantly worse survival than grade 3 oligodendroglioma (p = 0.0038)
  - Median OS after oligosarcoma was 5 years; no significant difference compared to
    grade 3 oligodendroglioma
  - Median OS after oligosarcoma was 8.3 years; oligosarcoma showed better survival
    than grade 3 oligodendroglioma
