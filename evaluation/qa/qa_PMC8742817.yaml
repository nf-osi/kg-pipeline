  question: What was the underlying mechanism explaining the loss of 1p/19q codeletion
    in some oligosarcomas while it was present in the primary lesions?
  user_query: why did some oligosarcomas lose 1p/19q codeletion?
  ideal: Copy number neutral loss of heterozygosity (CN-LOH) was determined as the
    underlying mechanism. The retained chromosomal arm was duplicated, resulting in
    allelic imbalance without deletion in log-R ratio.
  choices:
  - Complete chromosomal arm deletion followed by re-duplication
  - Copy number neutral loss of heterozygosity (CN-LOH)
  - Chromothripsis of chromosomes 1 and 19
  - Not in knowledgebase
