  question: What limitation exists regarding the cell type specificity of the observed
    effects in the in vivo P2ry14 knockout experiments in the P2RY14 study?
  user_query: what limitation about the P2ry14 knockout being global in P2RY14 study?
  ideal: Because a global knockout was used (not a conditional knockout), it cannot
    be excluded that the observed changes in microglial activation state could be
    due to indirect effects from P2ry14 loss in other cell types rather than direct
    microglial effects.
  choices:
  - The knockout may cause embryonic lethality confounding results
  - Since a global knockout was used, some in vivo effects may be SCP-independent
    due to P2ry14 expression in immune cells and sensory neurons
  - The knockout efficiency was too low to draw definitive conclusions
