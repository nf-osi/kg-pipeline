  user_query: did P2ry14 knockout fix the Remak bundle problems in NF1 mice?
  ideal: At 4 months, Nf1fl/fl;DhhCre nerves showed disrupted Remak bundles with reduced
    numbers of axons ensheathed by individual Schwann cells, and this phenotype was
    rescued in P2ry14-/-;Nf1fl/fl;DhhCre mice. By 7 months, the disruption was more
    severe in Nf1fl/fl;DhhCre nerves but was rescued to near wild-type levels by P2ry14
    loss.
