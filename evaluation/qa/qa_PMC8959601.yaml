  author: claude-opus-4-6
  question: What natural ligands activate the P2ry14 receptor, and why might NF1 mutant
    cells activate P2ry14 signaling even in the absence of exogenously added ligands?
  user_query: what activates P2ry14 and why does it seem to be active even without
    adding ligands to NF1 cells?
  ideal: P2ry14 is activated by extracellular UDP and UDP-sugars including UDP-glucose,
    UDP-galactose, UDP-glucuronic acid, and UDP-N-acetylglucosamine. NF1 mutant cells
    may release one or more of these ligands endogenously, as SCP self-renewal in
    serum-free medium was reduced by P2ry14 inhibition without added UDP or UDP-sugars.
    Additionally, the small increase in P2ry14 protein in mutant cells may contribute
    to increased signaling, and Nf1 deficient cells may release more UDP-sugars than
    WT cells.
  choices:
  - P2ry14 is activated by ATP and ADP; NF1 cells produce excessive ATP
  - P2ry14 is activated by UDP and UDP-sugars; NF1 mutant cells may endogenously release
    these ligands and/or have increased P2ry14 expression
  - P2ry14 is constitutively active and requires no ligand in NF1 mutant cells
  - Not in knowledgebase
