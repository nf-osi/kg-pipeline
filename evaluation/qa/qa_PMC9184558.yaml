  author: claude-opus-4-6
  question: What are the key limitations of the isogenic cell line panel experiments?
  user_query: what limitations of the cell line experiments?
  ideal: The experiments were performed in non-cancerous cell lines from tissues of origin that may not best reflect tumor
    biology. Additionally, the isogenic model relied on a single NF1 mutation (c.2041C>T) which may not represent the full
    spectrum of NF1 patient mutations.
  choices:
  - The CRISPR system had off-target effects that could not be controlled
  - The study used non-cancerous cell lines that may not reflect cancer biology, and not all genes had two or more knockouts
    in every background
  - The drug library was too small to identify meaningful hits
  - Not in knowledgebase
