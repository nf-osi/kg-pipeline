  author: claude-opus-4-6
  question: How does the multiplex screening approach use sequencing to measure relative cell growth in drug-treated wells?
  user_query: how does the sequencing-based pooled screen work to measure cell growth?
  ideal: Each cell line contains a unique integrated gRNA that serves as a DNA barcode. After co-culturing multiple cell lines
    in a single well and treating with drugs, universal primers amplify all integrated gRNAs. Sequencing of the amplification
    products reveals the representation of individual barcodes, which reflects the number of cells with each particular pathway
    disruption relative to others in the same well, providing ratiometric measurements of growth.
  choices:
  - Cells are sorted by FACS after drug treatment and counted individually
  - Each cell line has a unique gRNA barcode that is PCR-amplified and sequenced; barcode representation reflects relative
    cell number after drug treatment
  - Cell viability is measured by ATP-based luminescence assay after pooling
  - Not in knowledgebase
  correct_choice_index: 1
