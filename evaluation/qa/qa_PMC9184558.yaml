  author: claude-opus-4-6
  question: Compare the roles of Nutlin-3a and staurosporine as positive controls in the high-throughput screen. What different
    aspects of assay performance did each control address?
  user_query: what was the difference between nutlin and staurosporine as controls in the screen?
  ideal: Nutlin-3a served as a pathway-specific positive control by inhibiting MDM2 and thereby increasing p53 protein levels,
    which causes selective cell death/senescence in TP53 wild-type cells but not TP53 null cells, thus testing the assay's
    ability to detect pathway-specific differential effects. Staurosporine served as a non-specific cytotoxic control, producing
    general marked reduction in growth across all cell lines, testing the assay's ability to detect general toxicity.
  choices:
  - Nutlin-3a tested pathway-specific differential killing (TP53-dependent), while staurosporine tested non-specific cytotoxicity
    across all lines
  - Both served as non-specific cytotoxic controls but at different concentrations
  - Staurosporine was the pathway-specific control for DNA damage, while Nutlin-3a was the general toxicity control
  - Not in knowledgebase
  correct_choice_index: 0
  passage_indices: [31, 41]
  difficulty: hard
  question_type: comparative
