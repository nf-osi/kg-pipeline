  author: claude-opus-4-6
  question: What criteria had to be met for a compound to be classified as a 'hit' in the high-throughput screen, considering
    both statistical and biological significance as well as reproducibility requirements?
  user_query: what were the hit criteria in the screen? z-score and stuff?
  ideal: 'A compound had to meet three criteria: (1) a statistically significant Z-score of -1.5 or less (or -1.0 for low-powered
    cell lines), (2) a biologically significant effect of greater than 50% growth inhibition, and (3) this criteria had to
    be satisfied by independent cell lines with the same pathway disrupted in two different parental cell backgrounds. Additionally,
    compounds causing non-specific killing (less than two-fold more UIDs than staurosporine controls) were excluded.'
  choices:
  - Only Z-score < -2.0 was required with no biological significance threshold
  - Z-score ≤ -1.5, >50% growth inhibition, confirmed in two parental cell backgrounds, and exclusion of non-specific killers
  - Any compound with >25% growth inhibition in a single cell line was considered a hit
  - Not in knowledgebase
