  author: claude-opus-4-6
  question: What drug combination strategy uses the concept of 'drug fingerprints', and how do vertical and horizontal combination
    strategies differ?
  user_query: how can use drug fingerprints to pick drug combos, and what's the diff between vertical and horizontal
    strategies?
  ideal: Drug fingerprints can be defined by the pattern of correlation between drug responses and conserved network module
    eigengenes. Vertical combinations combine drugs with similar fingerprint patterns (targeting the same biological process/pathway),
    which can minimize drug resistance. Horizontal combinations combine drugs with complementary fingerprint patterns that
    target different biological processes simultaneously. For example, Selumetinib in DrugCluster 4 has a complementary pattern
    to DrugCluster 5, suggesting horizontal combination potential.
  choices:
  - Vertical combinations target different pathways while horizontal combinations target the same pathway at multiple points
  - Vertical combinations target the same pathway/process (similar fingerprints) to minimize resistance, while horizontal
    combinations target different processes (complementary fingerprints) simultaneously
  - Both strategies are identical but applied to different drug clusters
