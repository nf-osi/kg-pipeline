- id: PMC9221468-10
  pmcid: PMC9221468
  author: claude-opus-4-6
  question: What key advantage does the gene regulatory network-based methodology offer over traditional cell-culture-based
    drug screening for predicting in vivo drug efficacy?
  user_query: why is the network approach better than just using cell culture drug screens?
  ideal: The methodology focuses only on transcriptionally conserved gene networks across both cultured cells and primary
    PNs, thereby filtering out drugs whose effects are artifacts of the in vitro environment and less likely to be replicated
    in vivo. This addresses the inherent limitation that cell culture isolates cancer cells from the tumor microenvironment,
    trains them on non-biologic matrices, and can favor genetic drift, all of which can cause promising cell-culture results
    to fail in clinical trials.
  choices:
  - It uses machine learning to predict drug toxicity more accurately
  - It filters drug effects through conserved gene networks between cell lines and primary tumors, removing artifacts of in
    vitro conditions unlikely to replicate in vivo
  - It eliminates the need for any experimental validation
