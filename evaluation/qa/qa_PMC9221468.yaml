- id: PMC9221468-05
  pmcid: PMC9221468
  author: claude-opus-4-6
  question: How were the conserved gene regulation network modules constructed, and what criteria were used to determine module
    preservation?
  user_query: how did they build the gene networks and decide which modules were preserved?
  ideal: The gene regulation networks were constructed using the WGCNA package. Gene expression data from five PN cell lines
    were filtered by MAD > 1000 and merged with primary tumor transcriptomes to build a scale-free network with a soft-thresholding
    power of 8. Twenty-six network modules were established, and nine modules were determined to be conserved based on a Z-summary
    score > 5.
  choices:
  - Networks were built using differential expression analysis with a p-value cutoff of 0.05 for preservation
  - Networks were constructed using WGCNA with soft-thresholding power of 8; modules with Z-summary score > 5 were considered
    preserved
  - Networks were built using machine learning clustering with a silhouette score > 0.8 for preservation
  - Not in knowledgebase
