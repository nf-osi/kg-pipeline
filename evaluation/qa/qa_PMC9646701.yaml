  author: claude-opus-4-6
  question: How was the ErasmusLadder data handled given its unusual distribution, and what were the results for Nf1+/- mice?
  user_query: how did they deal with the erasmusladder data distribution and what did they find for nf1 mice
  ideal: 'The proportion of correct steps had a two-part distribution: ~16% of trials were ''clean sweeps'' (100% correct
    steps) while the rest had a mixture of correct steps and missteps. This required a two-model approach: (1) a binomial
    logistic regression analyzing clean sweep proportion, which showed a significant day effect and day × genotype interaction
    but no genotype effect, and (2) a beta regression for mixed trials only, which showed a significant day effect but no
    genotype or interaction effects. Overall, Nf1+/- mice showed equally good locomotion and gross motor function compared
    to wild-type littermates.'
  choices:
  - They used a single linear regression model and found significant motor deficits in Nf1+/- mice
  - They used a two-model approach (binomial logistic regression for clean sweeps and beta regression for mixed trials) due
    to a two-part distribution, finding no significant genotype differences overall
  - They excluded the ErasmusLadder data entirely due to the unusual distribution
  - Not in knowledgebase
