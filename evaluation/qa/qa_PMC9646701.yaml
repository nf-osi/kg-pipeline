  question: What statistical approaches were used to analyze the eyeblink conditioning data, and why were multilevel models
    chosen over standard parametric tests?
  user_query: what stats methods did they use for eyeblink conditioning analysis and why multilevel models
  ideal: CR proportion was analyzed using mixed effects binomial logistic regression, while normalized eye closure and CR
    timing were analyzed using linear mixed effect models. Multilevel models were chosen because they accommodate the nested
    data structure (trial within session, session within animal, animal within group), are more robust to normality violations,
    do not require homoscedasticity, and handle missing data better than repeated measures ANOVA.
  choices:
  - Standard two-way ANOVA because it handles repeated measures efficiently
  - Mixed effects logistic regression for CR proportion and linear mixed effect models for continuous outcomes, chosen for
    their ability to handle nested data structures, robustness to normality violations, and better handling of missing data
  - Non-parametric Kruskal-Wallis tests because the data was not normally distributed
  - Not in knowledgebase
