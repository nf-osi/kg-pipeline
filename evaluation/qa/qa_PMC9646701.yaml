  question: What is a key difference between eyeblink conditioning and VOR adaptation in terms of Purkinje
    cell activity during learning?
  user_query: what's the difference between eyeblink conditioning and VOR in terms of purkinje cell activity
  ideal: Eyeblink conditioning depends on downbound olivocerebellar modules and requires mainly a decrease in Purkinje cell
    simple-spike activity during learning, whereas VOR adaptation requires an increase of Purkinje cell simple-spike activity
    and depends on upbound modules.
  choices:
  - Eyeblink conditioning requires an increase in Purkinje cell complex spike activity, while VOR requires a decrease
  - Eyeblink conditioning requires mainly a decrease in Purkinje cell simple-spike activity (downbound modules), while VOR
    adaptation requires an increase (upbound modules)
  - There is no difference; both tasks depend on the same Purkinje cell activity patterns
  - Not in knowledgebase
