  author: claude-opus-4-6
  question: How does the sporadic MPNST cell lines differ from NF1-related cell lines
    in terms of tumor suppressor gene inactivation patterns, gain-of-function mutations,
    and methylome-based classification?
  user_query: what are main genomic differences between sporadic and NF1-related MPNST
    cell lines
  ideal: NF1-related cell lines exhibited the characteristic MPNST pattern of NF1,
    CDKN2A, and SUZ12/EED (PRC2) tumor suppressor gene inactivation with no gain-of-function
    mutations, and clustered within the MPNST methylation group. In contrast, sporadic
    cell lines collectively displayed different TSG inactivation patterns (e.g., wild-type
    PRC2 in some), harbored kinase-activating mutations (BRAF V600E in STS-26T, EML4-ALK
    in HS-PSS), had altered mutational frequencies and COSMIC signatures, and were
    classified by methylome analysis as melanoma (STS-26T and HS-Sch-2) or MPNST-like
    sarcoma (HS-PSS) rather than genuine MPNST.
  choices:
  - Sporadic MPNST lines had different TSG inactivation patterns, gain-of-function
    mutations (BRAF V600E, EML4-ALK), different mutational signatures, and were classified
    as melanoma or MPNST-like sarcoma by methylome analysis
  - Sporadic MPNST lines showed identical TSG inactivation as NF1-related lines but
    had higher ploidy and different structural variants
  - Sporadic MPNST lines lacked CDKN2A inactivation and had lower mutation frequencies
    than NF1-related lines
  - Not in knowledgebase
