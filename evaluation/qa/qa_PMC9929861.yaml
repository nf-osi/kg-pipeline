  question: Which cell line was found to be misidentified as having the same STR profile
    as ST88-14, and how was the genuine identity determined?
  user_query: which cell line cross contaminated with ST88-14 and how did they figure
    it out
  ideal: The T265 cell line was found to have the same STR profile as ST88-14. The
    genuine identity was determined by analyzing the oldest stored vials in their
    original labs and, more conclusively, by analyzing the primary tumor from which
    the ST88-14 cell line was isolated. ST88-14 was confirmed as the genuine cell
    line based on the NF1 germline mutation (c.1649dupT) and somatic copy number alteration
    landscape.
