  author: claude-opus-4-6
  question: What techniques were used to call and validate structural variants in
    the MPNST cell lines' whole-genome sequencing data?
  user_query: how did they detect structural variants from WGS for MPNST cell lines
  ideal: Structural variants were called using LUMPY via Smoove and CliffHunteR (an
    in-house developed R package for breakpoint detection), along with thorough visual
    inspection using Integrative Genomic Viewer (IGV). Inter-chromosomal rearrangements
    affecting commonly altered MPNST genes were validated by PCR and Sanger sequencing.
    Germline structural variants were filtered out using the Database of Genomic Variants
    (DGV) and by removing SVs with breakpoints in more than two cell lines.
  choices:
  - CNVkit for SV calling with validation by methylome analysis
  - LUMPY/Smoove and CliffHunteR for SV calling, IGV for visual inspection, and PCR/Sanger
    sequencing for validation
  - Strelka2 for SV calling with flow cytometry validation
