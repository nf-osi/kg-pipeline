  question: What are the key limitations regarding the characterization of MPNST cell
    lines?
  user_query: what limitations about MPNST cell line characterization
  ideal: 'Three main limitations exist: (1) the cell lines used may not completely
    represent the heterogeneity of MPNSTs in vivo, (2) the transcriptional profiles
    were generated from 2D cultures which may not reflect 3D tumor architecture, and
    (3) functional validation of identified therapeutic targets was limited.'
  choices:
  - Limited number of cell lines that may not fully represent MPNST diversity, lack
    of matched normal tissue for somatic variant calling, and potential misclassification
    of all sporadic lines
  - The only limitation was the absence of RNA-seq data
  - Lack of mouse models and inability to perform drug screening
