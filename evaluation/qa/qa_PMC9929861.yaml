  question: Which tumor suppressor gene was described as a bottleneck for MPNST formation,
    and how was it most commonly inactivated?
  user_query: which TSG is the bottleneck for MPNST and how is it usually lost
  ideal: CDKN2A was described as a bottleneck for MPNST formation. It was most commonly
    inactivated by structural alterations (homozygous loss), and was only inactivated
    by a point mutation in one cell line, exemplifying the low functional impact of
    small variants compared to structural variants in MPNST initiation.
  choices:
  - TP53, inactivated predominantly by point mutations
  - NF1, inactivated by loss of heterozygosity
  - CDKN2A, most often inactivated by structural alterations rather than point mutations
