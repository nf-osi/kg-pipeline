[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nf-kg-pipeline"
version = "0.1.0"
description = "NF Knowledge Graph Pipeline with Dagster"
requires-python = ">=3.9"
dependencies = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "pandas>=1.5.0",
    "pyoxigraph>=0.4.0",
    "rdflib>=7.0.0",
    "reasonable>=0.2.6",
    "synapseclient>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
]

[tool.setuptools]
packages = ["dagster_pipeline"]

[tool.dagster]
module_name = "dagster_pipeline"
