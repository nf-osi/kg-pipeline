<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NF Knowledge Graph Evaluation</title>
<meta name="description" content="Benchmark results for agents answering neurofibromatosis research questions against the NF portal knowledge graph — 16 research-tools discovery runs and 8 publication QA runs." />
<meta name="color-scheme" content="light dark" />
<style>
/* ==========================================================================
   NF Knowledge Graph Evaluation — dashboard styles

   Colour roles come from the validated reference palette (light + dark steps
   are each *selected* for their own surface, never an automatic flip).
   Every value below is a role; nothing in the markup references raw hex.
   ========================================================================== */

:root {
  color-scheme: light;

  /* surfaces & ink */
  --page:        #f9f9f7;
  --surface:     #fcfcfb;
  --surface-sub: #f4f4f1;
  --ink:         #0b0b0b;
  --ink-2:       #52514e;
  --ink-3:       #6f6d67;   /* 4.9:1 page / 5.0:1 surface — AA for UI copy */
  --grid:        #e1e0d9;
  --axis:        #c3c2b7;
  --border:      rgba(11, 11, 11, 0.10);
  --border-firm: rgba(11, 11, 11, 0.16);
  --wash:        rgba(11, 11, 11, 0.035);
  --wash-accent: rgba(42, 120, 214, 0.08);

  /* categorical slots — fixed order, assigned by entity, never cycled */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;
  --series-8: #e34948;

  /* De-emphasis for context marks in an emphasis chart. Deliberately below the
     3:1 mark floor so it stays recessive next to the accent; the relief rule
     applies and is met — every such point carries a direct label and a table
     view. Stepped up from #c9c8c2, which at 1.6:1 was near-invisible. */
  --muted-mark: #a3a199;

  /* the accent *as text* — series-1 is stepped for marks (>=3:1) and lands at
     4.2:1, under the 4.5:1 small-text bar, so links and badges use this step */
  --accent-text: #1c5cab;

  /* sequential blue ramp, light -> dark (magnitude encoding) */
  --seq-100: #cde2fb;
  --seq-150: #b7d3f6;
  --seq-200: #9ec5f4;
  --seq-250: #86b6ef;
  --seq-300: #6da7ec;
  --seq-350: #5598e7;
  --seq-400: #3987e5;
  --seq-450: #2a78d6;
  --seq-500: #256abf;
  --seq-550: #1c5cab;
  --seq-600: #184f95;
  --seq-650: #104281;
  --seq-700: #0d366b;

  /* status — reserved, never reused as a series colour */
  --good:     #0ca30c;
  --good-text:#006300;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;

  /* type */
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

  /* rhythm */
  --gutter: 24px;
  --radius: 10px;
  --radius-sm: 6px;
}

/* Dark steps are declared under both scopes: the media query covers the OS
   setting, the [data-theme] scope covers the in-page toggle, which wins. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-sub: #222221;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-3:       #918f88;
    --grid:        #2c2c2a;
    --axis:        #383835;
    --border:      rgba(255, 255, 255, 0.10);
    --border-firm: rgba(255, 255, 255, 0.18);
    --wash:        rgba(255, 255, 255, 0.045);
    --wash-accent: rgba(57, 135, 229, 0.14);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
    --accent-text: #5598e7;
    --muted-mark: #5e5e57;
    --good-text: #0ca30c;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page:        #0d0d0d;
  --surface:     #1a1a19;
  --surface-sub: #222221;
  --ink:         #ffffff;
  --ink-2:       #c3c2b7;
  --ink-3:       #918f88;
  --grid:        #2c2c2a;
  --axis:        #383835;
  --border:      rgba(255, 255, 255, 0.10);
  --border-firm: rgba(255, 255, 255, 0.18);
  --wash:        rgba(255, 255, 255, 0.045);
  --wash-accent: rgba(57, 135, 229, 0.14);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
  --accent-text: #5598e7;
  --muted-mark: #5e5e57;
  --good-text: #0ca30c;
}

/* --------------------------------------------------------------- reset ---- */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.011em; }
p { margin: 0; }
a { color: var(--accent-text); text-decoration-thickness: 1px; text-underline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.88em; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:where(button, select, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--series-1);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ------------------------------------------------------------- masthead --- */

.masthead {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--border);
}

.masthead-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 11px var(--gutter) 0;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 20px;
  align-items: start;
}

.brand { min-width: 0; }

.brand-title {
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ink-2);
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.brand-mark {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-text);
  border: 1px solid color-mix(in srgb, var(--series-1) 40%, transparent);
  background: var(--wash-accent);
  border-radius: 3px;
  padding: 1px 5px;
}

.masthead-tools { display: flex; align-items: center; gap: 10px; }

.stamp {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
}

.theme-toggle {
  appearance: none;
  border: 1px solid var(--border-firm);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
.theme-toggle:hover { background: var(--surface-sub); color: var(--ink); }
.theme-toggle svg { width: 15px; height: 15px; }
.theme-toggle .icon-dark { display: none; }
:root[data-theme="dark"] .theme-toggle .icon-dark { display: block; }
:root[data-theme="dark"] .theme-toggle .icon-light { display: none; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .theme-toggle .icon-dark { display: block; }
  :root:where(:not([data-theme="light"])) .theme-toggle .icon-light { display: none; }
}

/* ------------------------------------------------------------------ tabs --- */

/* These name the two benchmarks, so they lead the masthead. The active tab's
   accent bar is pulled down over the masthead hairline (margin-bottom: -1px)
   so the two read as one rule rather than a stack of lines. */
.tabs {
  grid-column: 1 / -1;
  display: flex;
  gap: 4px;
  margin: 8px 0 -1px;
}

.tab {
  appearance: none;
  background: none;
  background-clip: padding-box;   /* keep hover wash off the hairline */
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--ink-2);
  font: inherit;
  cursor: pointer;
  padding: 7px 15px 9px;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
  white-space: nowrap;
  transition: color 110ms ease, background-color 110ms ease;
}

.tab-name {
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: -0.017em;
}

.tab-task {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  color: var(--ink-2);
}

.tab-count {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-2);
  background: var(--wash);
  border-radius: 999px;
  padding: 1px 7px;
}

.tab:hover { background: var(--wash); }
.tab:hover, .tab:hover .tab-task, .tab:hover .tab-count { color: var(--ink); }

.tab[aria-selected="true"] {
  color: var(--ink);
  background: var(--wash-accent);
  border-bottom-color: var(--series-1);
}
.tab[aria-selected="true"] .tab-task { color: var(--accent-text); }
.tab[aria-selected="true"] .tab-count {
  color: var(--accent-text);
  background: color-mix(in srgb, var(--series-1) 14%, transparent);
}

/* Narrow: the task id is the first thing to go, then the row scrolls. */
@media (max-width: 720px) {
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 6px 11px 8px; gap: 7px; }
  .tab-name { font-size: 15px; }
  .tab-task { display: none; }
}

/* ------------------------------------------------------------------ page --- */

main {
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px var(--gutter) 72px;
}

.panel[hidden] { display: none; }

.panel-lede {
  max-width: 68ch;
  color: var(--ink-2);
  font-size: 14.5px;
  margin-bottom: 22px;
}
.panel-lede strong { color: var(--ink); font-weight: 600; }

/* ------------------------------------------------------------ hero + kpi --- */

.hero {
  display: grid;
  grid-template-columns: minmax(230px, 300px) 1fr;
  gap: 28px;
  align-items: stretch;
  padding: 22px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 22px;
}

.hero-figure { border-right: 1px solid var(--border); padding-right: 24px; }

.hero-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.hero-value {
  font-size: 56px;
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
  margin: 6px 0 2px;
  /* proportional figures: tabular-nums makes a display number look loose */
}

.hero-caption { font-size: 13px; color: var(--ink-2); }
.hero-caption .hero-model { color: var(--ink); font-weight: 600; }

.hero-note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 20px 26px;
  align-content: center;
}

.kpi-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.kpi-value {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-top: 3px;
}
.kpi-caption { font-size: 12px; color: var(--ink-3); }
.kpi-delta { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
.kpi-delta.up { color: var(--good-text); }
.kpi-delta.down { color: var(--critical); }

@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .hero-figure { border-right: 0; border-bottom: 1px solid var(--border); padding: 0 0 18px; }
}

/* ---------------------------------------------------------- filter row ----- */

.filters {
  position: sticky;
  top: calc(var(--masthead-h, 96px) + 10px);
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
  padding: 10px 14px;
  margin-bottom: 24px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.filter-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 8px;
  min-width: 0;
}

.filter-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}

/* segmented control */
.segmented {
  display: inline-flex;
  flex-wrap: wrap;
  max-width: 100%;
  background: var(--surface-sub);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px;
}
.segmented button {
  appearance: none;
  border: 0;
  background: none;
  font: inherit;
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 4px 11px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}
.segmented button:hover { color: var(--ink); }
.segmented button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

/* entity chips — the swatch carries identity, the text stays ink */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border-firm);
  background: var(--surface);
  color: var(--ink-3);
  font: inherit;
  font-size: 12.5px;
  padding: 3px 10px 3px 8px;
  border-radius: 999px;
  cursor: pointer;
}
.chip:hover { background: var(--surface-sub); color: var(--ink-2); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--border-firm); background: var(--wash); }
.chip[aria-pressed="false"] .chip-swatch { background: var(--muted-mark) !important; }
/* model has no runs under the current slice — still clickable, since the
   cross-set sections below use it, but it should not look like live data */
.chip[data-empty="true"] { opacity: 0.45; }
.chip[data-empty="true"]::after {
  content: "no data";
  font-size: 10px;
  color: var(--ink-3);
  border-left: 1px solid var(--border-firm);
  padding-left: 6px;
  margin-left: 1px;
}
.chip-swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

.filter-reset {
  appearance: none;
  border: 0;
  background: none;
  font: inherit;
  font-size: 12.5px;
  color: var(--ink-3);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  margin-left: auto;
}
.filter-reset:hover { color: var(--ink); }

.filter-note {
  flex-basis: 100%;
  font-size: 12px;
  color: var(--ink-3);
}

@media (max-width: 900px) { .filters { position: static; } }

/* ------------------------------------------------------------- sections --- */

.section-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 34px 0 14px;
}
.section-head h2 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}
.section-head .rule { flex: 1; height: 1px; background: var(--border); }

/* A long section title must wrap rather than push the page sideways. */
@media (max-width: 720px) {
  .section-head { flex-wrap: wrap; }
  .section-head h2 { white-space: normal; }
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
  gap: 20px;
  align-items: start;
}
.grid > .span-2 { grid-column: 1 / -1; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

/* ----------------------------------------------------------------- card --- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px 20px;
  min-width: 0;
}

.card-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 14px;
  align-items: start;
  margin-bottom: 4px;
}

.card-title { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
.card-sub {
  grid-column: 1;
  font-size: 12.5px;
  color: var(--ink-3);
  max-width: 62ch;
}

.card-actions { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; align-items: center; }

.ghost-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: none;
  color: var(--ink-3);
  font: inherit;
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
}
.ghost-btn:hover { color: var(--ink); background: var(--surface-sub); }
.ghost-btn[aria-pressed="true"] { color: var(--ink); background: var(--wash); border-color: var(--border-firm); }

.badge {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  vertical-align: 1.5px;
  white-space: nowrap;
}
.badge-new {
  color: var(--accent-text);
  background: var(--wash-accent);
  border: 1px solid color-mix(in srgb, var(--series-1) 35%, transparent);
}

/* ---------------------------------------------------------------- chart --- */

.chart-wrap { position: relative; margin-top: 14px; }
.chart-wrap[data-view="table"] .chart-svg { display: none; }
.chart-wrap[data-view="chart"] .chart-table-view { display: none; }

.chart-svg { display: block; width: 100%; overflow: visible; }
.chart-svg text { font-family: var(--sans); }

.chart-empty {
  padding: 34px 8px;
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
  border: 1px dashed var(--border-firm);
  border-radius: var(--radius-sm);
}

/* legend — always present for two or more series */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin-top: 12px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-key { flex: none; }
.legend-key.rect { width: 11px; height: 11px; border-radius: 2px; }
.legend-key.line { width: 16px; height: 2px; border-radius: 1px; }
.legend-key.dot { width: 9px; height: 9px; border-radius: 50%; }
.legend-key.hollow { width: 9px; height: 9px; border-radius: 50%; background: var(--surface) !important; border: 2px solid currentColor; }

.scale-legend { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.scale-ramp { display: flex; height: 8px; border-radius: 2px; overflow: hidden; width: 132px; }
.scale-ramp span { flex: 1; }

/* tooltip */
.tooltip {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, calc(-100% - 12px));
  transition: opacity 90ms linear;
  background: var(--surface);
  border: 1px solid var(--border-firm);
  border-radius: var(--radius-sm);
  box-shadow: 0 6px 22px -8px rgba(0, 0, 0, 0.35);
  padding: 9px 11px;
  min-width: 130px;
  max-width: 280px;
}
.tooltip[data-open="true"] { opacity: 1; }
.tooltip-title { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
.tooltip-sub { font-size: 11.5px; color: var(--ink-3); margin-bottom: 6px; }
.tooltip-row {
  display: grid;
  grid-template-columns: 14px 1fr auto;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-2);
  padding: 1px 0;
}
/* values lead: the number is the strong element, the label is secondary */
.tooltip-row .tr-value { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tooltip-row .tr-key { height: 2px; border-radius: 1px; }
.tooltip-row .tr-key.dot { height: 8px; width: 8px; border-radius: 50%; margin-left: 3px; }

/* ---------------------------------------------------------------- table --- */

.table-scroll { overflow-x: auto; margin-top: 14px; }
.table-scroll::-webkit-scrollbar { height: 10px; }
.table-scroll::-webkit-scrollbar-thumb { background: var(--axis); border-radius: 5px; }

table.data {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

table.data caption { text-align: left; font-size: 12.5px; color: var(--ink-3); padding-bottom: 8px; }

table.data th, table.data td {
  padding: 7px 11px;
  text-align: right;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
table.data th:first-child, table.data td:first-child,
table.data th.text, table.data td.text { text-align: left; }

table.data thead th {
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;

  content: "";

  width: 0; height: 0;
  margin-left: 5px;

      labels.push({ p: p, cx: cx, cy: cy, y: cy });
    });

    /* direct labels — right of the mark, flipped left when they would clip */
    var LBL_FONT = 11.5;
    var placed = [];
    labels.forEach(function (L) {
      var w = textWidth(L.p.label, LBL_FONT);
      var fitsRight = L.cx + 11 + w <= plot.x1;
      var fitsLeft = L.cx - 11 - w >= plot.x0;
      /* No room either side: the legend, tooltip and table view still carry
         the name, so a clipped label is the one thing we do not ship. */
      if (!fitsRight && !fitsLeft) return;
      L.side = fitsRight ? 1 : -1;
      L.x0 = fitsRight ? L.cx + 9 : L.cx - 11 - w;
      L.x1 = fitsRight ? L.cx + 11 + w : L.cx - 9;
      placed.push(L);
    });
    decollide(placed, 15, plot.y0 + 6, plot.y1 - 2);
    placed.forEach(function (L) {
      var lx = L.cx + L.side * 11;
      text(g, L.p.label, {
        x: lx, y: L.y + 3.5, "text-anchor": L.side > 0 ? "start" : "end",
        "font-size": LBL_FONT, fill: L.p.emph ? "var(--ink)" : "var(--ink-3)",
        "font-weight": L.p.emph ? 600 : 400
      });
      if (Math.abs(L.y - L.cy) > 4) {
        el("path", {
          d: "M" + (L.cx + L.side * 7) + "," + L.cy + "L" + (lx - L.side * 2) + "," + L.y,
          stroke: "var(--axis)", "stroke-width": 1, fill: "none"
        }, g);
      }
    });

    return true;
  }

  /* ------------------------------------------------------------------ lines -- */

  /* Ordinal or linear x. End-labelled, crosshair-driven: the reader aims at a
     category, never at a 2px line, and one tooltip lists every series there. */
  function renderLines(svg, spec, size) {
    var series = spec.series.filter(function (s) {
      return s.values.some(function (v) { return v !== null && v !== undefined; });
    });
    if (!series.length) return false;

    var cats = spec.categories;
    var W = size.width, H = spec.height || 320;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("height", H);

    var all = [];
    series.forEach(function (s) {
      s.values.forEach(function (v) { if (v !== null && v !== undefined) all.push(v); });
    });
    var ye = extent(all);
    var span = ye[1] - ye[0];
    var yMin = spec.yZero ? 0 : Math.max(0, ye[0] - Math.max(span * 0.25, 0.03));
    var yMax = Math.min(spec.yMaxCap === undefined ? 1 : spec.yMaxCap, ye[1] + Math.max(span * 0.25, 0.03));
    if (yMax - yMin < 0.06) { yMin = Math.max(0, yMin - 0.03); yMax = yMin + 0.09; }

    /* Category labels are centred on their tick, so the first and last need
       half a label of padding or they escape the card. */
    var CAT_FONT = 11.5;
    var catHalf = cats.reduce(function (m, c) {
      return Math.max(m, textWidth(c, CAT_FONT));
    }, 0) / 2 + 4;
    var LABEL_FONT = 11.5;
    var endGutterCap = Math.max(90, Math.min(230, W * 0.28));
    var widestSeries = series.reduce(function (m, s) {
      return Math.max(m, textWidth(s.label, LABEL_FONT));
    }, 0);
    var endGutter = Math.min(endGutterCap, widestSeries + 20);
    var labelRoom = spec.endLabels === false ? Math.max(20, catHalf) : endGutter;
    var pad = {
      top: 18, right: labelRoom, bottom: spec.xLabel ? 52 : 38,
      left: Math.max(52, catHalf)
    };
    var plotW = W - pad.left - pad.right, plotH = H - pad.top - pad.bottom;
    var sy = function (v) { return H - pad.bottom - ((v - yMin) / (yMax - yMin)) * plotH; };
    var n = cats.length;
    var sx = function (i) { return n === 1 ? pad.left + plotW / 2 : pad.left + (i / (n - 1)) * plotW; };

    var f = frame(svg, {
      width: W, height: H, pad: pad, yScale: sy,
      yTicks: niceTicks(yMin, yMax, tickCount(plotH * 1.6)), yFmt: spec.yFmt || fmt.axisScore,
      yLabel: spec.yLabel, xLabel: spec.xLabel
    });
    var g = f.g, plot = f.plot;

    /* Thin the tick labels by measured position rather than a fixed stride, so
       the first and last always survive and nothing ever overlaps. */
    var keep = [], cursor = -Infinity;
    for (var ci = 0; ci < n; ci++) {
      var cwid = textWidth(cats[ci], CAT_FONT);
      if (ci === 0 || sx(ci) - cwid / 2 >= cursor + 6) {
        keep.push(ci);
        cursor = sx(ci) + cwid / 2;
      }
    }
    if (keep[keep.length - 1] !== n - 1) {
      /* the last category always gets a label; drop whatever it would hit */
      var lastW = textWidth(cats[n - 1], CAT_FONT);
      while (keep.length > 1 &&
             sx(keep[keep.length - 1]) + textWidth(cats[keep[keep.length - 1]], CAT_FONT) / 2 + 6 >
             sx(n - 1) - lastW / 2) {
        keep.pop();
      }
      keep.push(n - 1);
    }
    keep.forEach(function (i) {
      var label = cats[i];
      var half = textWidth(label, CAT_FONT) / 2;
      /* pin the end labels inside the frame instead of letting them escape */
      var anchor = "middle", x = sx(i);
      if (x - half < 1) { anchor = "start"; x = 1; }
      else if (x + half > W - 1) { anchor = "end"; x = W - 1; }
      text(g, label, {
        x: x, y: plot.y1 + 22, "text-anchor": anchor, "font-size": CAT_FONT,
        fill: "var(--ink-2)"
      });
    });

    /* crosshair band, one per category — the hit target is the whole column */
    var cross = el("line", {
      x1: 0, y1: plot.y0, x2: 0, y2: plot.y1, stroke: "var(--axis)",
      "stroke-width": 1, opacity: 0, "pointer-events": "none"
    }, g);

    series.forEach(function (s) {
      var d = "", started = false;
      s.values.forEach(function (v, i) {
        if (v === null || v === undefined) { started = false; return; }
        d += (started ? "L" : "M") + sx(i) + "," + sy(v);
        started = true;
      });
      el("path", {
        d: d, fill: "none", stroke: s.color, "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round",
        "stroke-dasharray": s.dash || null
      }, g);
      s.values.forEach(function (v, i) {
        if (v === null || v === undefined) return;
        el("circle", {
          cx: sx(i), cy: sy(v), r: 4.5, fill: s.hollow ? "var(--surface)" : s.color,
          stroke: s.hollow ? s.color : "var(--surface)", "stroke-width": 2
        }, g);
      });
    });

    /* end labels, de-collided with leader lines */
    if (spec.endLabels !== false) {
      var ends = [];
      series.forEach(function (s) {
        for (var i = s.values.length - 1; i >= 0; i--) {
          var v = s.values[i];
          if (v !== null && v !== undefined) {
            ends.push({ s: s, i: i, v: v, cy: sy(v), y: sy(v) });
            break;
          }
        }
      });
      decollide(ends, 15, plot.y0 + 5, plot.y1);
      ends.forEach(function (E) {
        var x = sx(E.i);
        text(g, fitLabel(E.s.label, W - x - 16, LABEL_FONT), {
          x: x + 12, y: E.y + 4, "text-anchor": "start", "font-size": 11.5,
          fill: "var(--ink-2)"
        });
        if (Math.abs(E.y - E.cy) > 3) {
          el("path", {
            d: "M" + (x + 7) + "," + E.cy + "L" + (x + 10) + "," + E.y,
            stroke: "var(--axis)", "stroke-width": 1, fill: "none"
          }, g);
        }
      });
    }

    var bands = el("g", null, g);
    cats.forEach(function (c, i) {
      var bw = n === 1 ? plotW : plotW / (n - 1);
      var bx = Math.max(plot.x0, sx(i) - bw / 2);
      var bw2 = Math.min(plot.x1, sx(i) + bw / 2) - bx;
      var band = el("rect", {
        x: bx, y: plot.y0, width: bw2, height: plotH, fill: "transparent",
        tabindex: 0, role: "img",
        "aria-label": c + ": " + series.map(function (s) {
          return s.label + " " + fmt.score(s.values[i]);
        }).join(", ")
      }, bands);

      function show() {
        cross.setAttribute("x1", sx(i));
        cross.setAttribute("x2", sx(i));
        cross.setAttribute("opacity", 0.5);
        var box = band.getBoundingClientRect();
        var rows = series.map(function (s) {
          return {
            label: s.label, color: s.color,
            value: (spec.tipFmt || fmt.score)(s.values[i])
          };
        });
        /* optional per-category detail, e.g. which run produced this point */
        if (spec.pointRows) rows = rows.concat(spec.pointRows(i) || []);
        showTip(box.left + box.width / 2, box.top + 8, {
          title: c,
          sub: spec.tipSub,
          rows: rows
        });
      }
      function hide() { cross.setAttribute("opacity", 0); hideTip(); }
      band.addEventListener("pointerenter", show);
      band.addEventListener("pointermove", show);
      band.addEventListener("pointerleave", hide);
      band.addEventListener("focus", show);
      band.addEventListener("blur", hide);
    });

    return true;
  }

  /* --------------------------------------------------------------- dumbbell -- */

  /* Before -> after per row: one hue, two shades, connector carries the gap. */
  function renderDumbbell(svg, spec, size) {
    var rows = spec.rows.filter(function (r) {
      return r.a !== null && r.a !== undefined && r.b !== null && r.b !== undefined;
    });
    if (!rows.length) return false;

    var W = size.width;
    var rowH = 30;
    var ROW_FONT = 12;
    var gutterCap = Math.max(110, Math.min(spec.labelWidth || 230, W * 0.34));
    var gutter = Math.min(gutterCap, rows.reduce(function (m, r) {
      return Math.max(m, textWidth(r.label, ROW_FONT));
    }, 0) + 18);
    var pad = { top: 16, right: 54, bottom: 40, left: gutter };
    var H = pad.top + pad.bottom + rows.length * rowH;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("height", H);

    var vals = [];
    rows.forEach(function (r) { vals.push(r.a, r.b); });
    var ve = extent(vals);
    var xMin = spec.xZero ? 0 : Math.max(0, ve[0] - Math.max((ve[1] - ve[0]) * 0.22, 0.04));
    var xMax = Math.min(spec.xMaxCap === undefined ? 1 : spec.xMaxCap,
      ve[1] + Math.max((ve[1] - ve[0]) * 0.22, 0.04));
    if (xMax - xMin < 0.08) { xMin = Math.max(0, xMin - 0.04); xMax = xMin + 0.12; }

    var plotW = W - pad.left - pad.right;
    var sx = function (v) { return pad.left + ((v - xMin) / (xMax - xMin)) * plotW; };
    var g = el("g", null, svg);

    niceTicks(xMin, xMax, tickCount(plotW)).forEach(function (t) {
      var x = sx(t);
      el("line", {
        x1: x, y1: pad.top - 4, x2: x, y2: H - pad.bottom + 4,
        stroke: "var(--grid)", "stroke-width": 1, "shape-rendering": "crispEdges"
      }, g);
      text(g, (spec.xFmt || fmt.axisScore)(t), {
        x: x, y: H - pad.bottom + 21, "text-anchor": "middle", "font-size": 11,
        fill: "var(--ink-3)", "font-variant-numeric": "tabular-nums"
      });
    });
    if (spec.xLabel) {
      text(g, fitLabel(spec.xLabel, W - 10, 11.5), {
        x: W / 2, y: H - 4, "text-anchor": "middle",
        "font-size": 11.5, fill: "var(--ink-3)", "letter-spacing": "0.04em"
      });
    }

    rows.forEach(function (r, i) {
      var cy = pad.top + i * rowH + rowH / 2;
      var xa = sx(r.a), xb = sx(r.b);
      var color = r.color || "var(--series-1)";

      text(g, fitLabel(r.label, pad.left - 14, ROW_FONT), {
        x: pad.left - 12, y: cy + 4, "text-anchor": "end", "font-size": ROW_FONT,
        fill: "var(--ink-2)"
      });

      el("line", {
        x1: Math.min(xa, xb) + 5, y1: cy, x2: Math.max(xa, xb) - 5, y2: cy,
        stroke: color, "stroke-width": 2, opacity: 0.28, "stroke-linecap": "round"
      }, g);

      /* first mark hollow, second filled — two shades of the row's own hue */
      el("circle", {
        cx: xa, cy: cy, r: 5, fill: "var(--surface)", stroke: color, "stroke-width": 2
      }, g);
      el("circle", {
        cx: xb, cy: cy, r: 5, fill: color, stroke: "var(--surface)", "stroke-width": 2
      }, g);

      /* value at the trailing end only — never a number on every mark */
      var lead = xb >= xa ? xb : xa;
      text(g, (spec.valueFmt || fmt.score2)(xb >= xa ? r.b : r.a), {
        x: lead + 11, y: cy + 4, "text-anchor": "start", "font-size": 11.5,
        fill: "var(--ink)", "font-weight": 600, "font-variant-numeric": "tabular-nums"
      });

      var hit = el("rect", {
        x: pad.left - 4, y: cy - rowH / 2, width: plotW + 8, height: rowH,
        fill: "transparent", tabindex: 0, role: "img",
        "aria-label": r.label + ": " + spec.aLabel + " " + fmt.score(r.a) +
          ", " + spec.bLabel + " " + fmt.score(r.b)
      }, g);
      function show() {
        var box = hit.getBoundingClientRect();
        showTip(box.left + box.width / 2, box.top, {
          title: r.label,
          sub: r.sub,
          rows: [
            { label: spec.aLabel, value: (spec.valueFmt || fmt.score)(r.a), color: color, keyShape: "dot" },
            { label: spec.bLabel, value: (spec.valueFmt || fmt.score)(r.b), color: color, keyShape: "dot" },
            { label: "Difference", value: ((r.b - r.a) >= 0 ? "+" : "") + (r.b - r.a).toFixed(3) }
          ]
        });
      }
      hit.addEventListener("pointerenter", show);
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("focus", show);
      hit.addEventListener("blur", hideTip);
    });

    return true;
  }

  /* ---------------------------------------------------------------- heatmap -- */

  /* Magnitude across a grid: one hue, light -> dark. Every cell is labelled,
     so the encoding is never colour-only. */
  var SEQ = ["var(--seq-100)", "var(--seq-200)", "var(--seq-300)", "var(--seq-400)",
             "var(--seq-500)", "var(--seq-600)", "var(--seq-700)"];

  function seqColor(t) {
    if (t === null || t === undefined || isNaN(t)) return "var(--surface-sub)";
    var i = Math.min(SEQ.length - 1, Math.max(0, Math.round(t * (SEQ.length - 1))));
    return SEQ[i];
  }

  function renderHeatmap(svg, spec, size) {
    if (!spec.rows.length || !spec.cols.length) return false;

    var W = size.width;
    var ROW_FONT = 12;
    var labelCap = Math.max(110, Math.min(spec.labelWidth || 230, W * 0.30));
    var labelW = Math.min(labelCap, spec.rows.reduce(function (m, r) {
      return Math.max(m, textWidth(r.label, ROW_FONT));
    }, 0) + 22);
    var cellH = 34;
    /* Header height is measured, not guessed: wrapped column titles get their
       own lines and a "new" badge gets a line of its own beneath them, so a
       badge can never land on top of the title or the first row of cells. */
    var anyBadge = spec.cols.some(function (c) { return !!c.badge; });
    var LINE_H = 15, BADGE_H = 14;
    var gridW = W - labelW - 4;
    var cw = gridW / spec.cols.length;

    /* Below this the grid stops being a chart: nine columns in 300px cannot be
       labelled at any angle, so the table view is the honest answer. */
    if (cw < 46) return "table";

    /* Wrap each column title to the cell width before deciding the height.
       Hyphens break like spaces, and any line still too wide is shortened —
       the full name stays in the tooltip and the table view. */
    var HEAD_FONT = 11;
    var lineMax = cw - 5;
    var wrapped = spec.cols.map(function (c) {
      var words = String(c.label).split(/(?<=-)|\s+/);
      var lines = [], cur = "";
      words.forEach(function (w) {
        var joiner = /-$/.test(cur) ? "" : " ";
        var candidate = cur.length ? cur + joiner + w : w;
        if (!cur.length || textWidth(candidate, HEAD_FONT) <= lineMax) cur = candidate;
        else { lines.push(cur); cur = w; }
      });
      if (cur.length) lines.push(cur);
      return lines.slice(0, 3).map(function (line) {
        return fitLabel(line.trim(), lineMax, HEAD_FONT);
      });
    });
    var maxLines = wrapped.reduce(function (m, l) { return Math.max(m, l.length); }, 1);
    var headH = 6 + maxLines * LINE_H + (anyBadge ? BADGE_H + 3 : 0) + 5;

    var pad = { top: headH, right: 4, bottom: 8, left: labelW };
    var H = pad.top + pad.bottom + spec.rows.length * cellH;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("height", H);

    var g = el("g", null, svg);
    var lo = spec.domain ? spec.domain[0] : 0;
    var hi = spec.domain ? spec.domain[1] : 1;

    spec.cols.forEach(function (c, j) {
      var cx = pad.left + j * cw + cw / 2;
      var lines = wrapped[j];
      /* bottom-align the title block so short and tall titles share a baseline */
      var blockTop = 6 + (maxLines - lines.length) * LINE_H;
      lines.forEach(function (line, li) {
        text(g, line, {
          x: cx, y: blockTop + li * LINE_H + 10,
          "text-anchor": "middle", "font-size": HEAD_FONT, fill: "var(--ink-2)"
        });
      });
      if (c.badge) {
        var bw = c.badge.length * 5.6 + 9;
        var by = 6 + maxLines * LINE_H + 2;
        el("rect", {
          x: cx - bw / 2, y: by, width: bw, height: 12, rx: 3,
          fill: "var(--wash-accent)", stroke: "var(--series-1)",
          "stroke-width": 1, "stroke-opacity": 0.35
        }, g);
        text(g, c.badge, {
          x: cx, y: by + 9, "text-anchor": "middle", "font-size": 8.5,
          fill: "var(--accent-text)", "font-weight": 600, "letter-spacing": "0.07em"
        });
      }
    });

    spec.rows.forEach(function (r, i) {
      var y = pad.top + i * cellH;
      text(g, fitLabel(r.label, pad.left - 16, ROW_FONT), {
        x: pad.left - 12, y: y + cellH / 2 + 4, "text-anchor": "end",
        "font-size": ROW_FONT, fill: "var(--ink-2)"
      });
      if (r.color) {
        el("rect", {
          x: pad.left - 8, y: y + cellH / 2 - 4, width: 3, height: 8, rx: 1.5, fill: r.color
        }, g);
      }

      spec.cols.forEach(function (c, j) {
        var v = r.values[j];
        var x = pad.left + j * cw;
        /* 2px surface gap does the separating — never a stroke around the cell */
        var cell = el("rect", {
          x: x + 1, y: y + 1, width: Math.max(1, cw - 2), height: cellH - 2, rx: 3,
          fill: v === null || v === undefined ? "var(--surface-sub)" : seqColor((v - lo) / (hi - lo)),
          tabindex: 0, role: "img",
          "aria-label": r.label + ", " + c.label + ": " +
            (v === null || v === undefined ? "no data" : fmt.score(v))
        }, g);

        var t = v === null || v === undefined ? null : (v - lo) / (hi - lo);
        /* label inside a filled cell: pick ink or white by the fill's depth */
        var onDark = t !== null && t > 0.55;
        text(g, v === null || v === undefined ? "—" : (spec.valueFmt || fmt.score2)(v), {
          x: x + cw / 2, y: y + cellH / 2 + 4, "text-anchor": "middle",
          "font-size": 11.5, "font-variant-numeric": "tabular-nums",
          fill: v === null || v === undefined ? "var(--ink-3)" : (onDark ? "#ffffff" : "#0b0b0b"),
          "font-weight": 500, "pointer-events": "none"
        });

        function show() {
          cell.setAttribute("stroke", "var(--ink)");
          cell.setAttribute("stroke-width", 1.5);
          var a = anchorOf(cell);
          showTip(a.x, a.y, {
            title: c.label,
            sub: r.label,
            rows: [{
              label: spec.measure || "Score",
              value: v === null || v === undefined ? "no data" : fmt.score(v)
            }].concat(c.note ? [{ label: "Questions", value: c.note }] : [])
          });
        }
        function hide() { cell.removeAttribute("stroke"); hideTip(); }
        cell.addEventListener("pointerenter", show);
        cell.addEventListener("pointerleave", hide);
        cell.addEventListener("focus", show);
        cell.addEventListener("blur", hide);
      });
    });

    return true;
  }

  /* ------------------------------------------------------------------- hbar -- */

  /* Horizontal bars: one series, one colour. Long category names get the room
     they need, and the value rides the bar tip. */
  function renderHBar(svg, spec, size) {
    var rows = spec.rows.filter(function (r) { return r.value !== null && r.value !== undefined; });
    if (!rows.length) return false;

    var W = size.width;
    var rowH = spec.rowHeight || 26;
    var barH = Math.min(14, rowH - 10);
    var ROW_FONT = 12;
    var labelCap = Math.max(100, Math.min(spec.labelWidth || 240, W * 0.36));
    var gutter = Math.min(labelCap, rows.reduce(function (m, r) {
      return Math.max(m, textWidth(r.label, ROW_FONT));
    }, 0) + 16);
    var pad = { top: 8, right: 52, bottom: 38, left: gutter };
    var H = pad.top + pad.bottom + rows.length * rowH;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("height", H);

    var ve = extent(rows.map(function (r) { return r.value; }));
    var xMax = spec.xMax !== undefined ? spec.xMax : Math.min(1, ve[1] * 1.08);
    var plotW = W - pad.left - pad.right;
    var sx = function (v) { return (v / xMax) * plotW; };
    var g = el("g", null, svg);

    niceTicks(0, xMax, tickCount(plotW)).forEach(function (t) {
      var x = pad.left + sx(t);
      el("line", {
        x1: x, y1: pad.top, x2: x, y2: H - pad.bottom + 4,
        stroke: "var(--grid)", "stroke-width": 1, "shape-rendering": "crispEdges"
      }, g);
      text(g, (spec.xFmt || fmt.axisScore)(t), {
        x: x, y: H - pad.bottom + 21, "text-anchor": "middle", "font-size": 11,
        fill: "var(--ink-3)", "font-variant-numeric": "tabular-nums"
      });
    });
    if (spec.xLabel) {
      text(g, fitLabel(spec.xLabel, W - 10, 11.5), {
        x: W / 2, y: H - 3, "text-anchor": "middle",
        "font-size": 11.5, fill: "var(--ink-3)", "letter-spacing": "0.04em"
      });
    }
    el("line", {
      x1: pad.left, y1: pad.top, x2: pad.left, y2: H - pad.bottom,
      stroke: "var(--axis)", "stroke-width": 1, "shape-rendering": "crispEdges"
    }, g);

    rows.forEach(function (r, i) {
      var cy = pad.top + i * rowH + rowH / 2;
      var w = Math.max(1.5, sx(r.value));
      var color = r.color || "var(--series-1)";

      text(g, fitLabel(r.label, pad.left - 13, ROW_FONT), {
        x: pad.left - 11, y: cy + 4, "text-anchor": "end", "font-size": ROW_FONT,
        fill: "var(--ink-2)"
      });

      /* 4px rounded data-end, square at the baseline */
      var rr = Math.min(4, w);
      el("path", {
        d: "M" + pad.left + "," + (cy - barH / 2) +
           "H" + (pad.left + w - rr) +
           "a" + rr + "," + rr + " 0 0 1 " + rr + "," + rr +
           "V" + (cy + barH / 2 - rr) +
           "a" + rr + "," + rr + " 0 0 1 " + (-rr) + "," + rr +
           "H" + pad.left + "Z",
        fill: color
      }, g);

      text(g, (spec.valueFmt || fmt.score2)(r.value), {
        x: pad.left + w + 9, y: cy + 4, "text-anchor": "start", "font-size": 11.5,
        fill: "var(--ink)", "font-weight": 600, "font-variant-numeric": "tabular-nums"
      });

      var hit = el("rect", {
        x: pad.left - 4, y: cy - rowH / 2, width: plotW + 8, height: rowH,
        fill: "transparent", tabindex: 0, role: "img",
        "aria-label": r.label + ": " + fmt.score(r.value)
      }, g);
      function show() {
        var box = hit.getBoundingClientRect();
        showTip(box.left + Math.min(box.width, pad.left + w), box.top, {
          title: r.label,
          sub: r.sub,
          rows: [{ label: spec.measure || "Value", value: (spec.tipFmt || fmt.score)(r.value), color: color }]
            .concat(r.rows || [])
        });
      }
      hit.addEventListener("pointerenter", show);
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("focus", show);
      hit.addEventListener("blur", hideTip);
    });

    return true;
  }

  /* ------------------------------------------------------------ table twin -- */

  function buildTableTwin(spec, type) {
    var cols = [], rows = [];

    if (type === "scatter") {
      cols = [spec.tableKey || "Series", spec.xLabel || "x", spec.yLabel || "y"];
      rows = spec.points.map(function (p) {
        return [p.label, spec.xFmt ? spec.xFmt(p.x) : String(p.x), fmt.score(p.y)];
      });
    } else if (type === "lines") {
      var lineFmt = spec.tipFmt || fmt.score;
      cols = [spec.tableKey || "Series"].concat(spec.categories);
      rows = spec.series.map(function (s) {
        return [s.label].concat(s.values.map(function (v) { return lineFmt(v); }));
      });
    } else if (type === "dumbbell") {
      cols = [spec.tableKey || "Series", spec.aLabel, spec.bLabel, "Difference"];
      rows = spec.rows.map(function (r) {
        return [r.label, fmt.score(r.a), fmt.score(r.b),
          (r.b - r.a >= 0 ? "+" : "") + (r.b - r.a).toFixed(3)];
      });
    } else if (type === "heatmap") {
      cols = [spec.tableKey || "Series"].concat(spec.cols.map(function (c) { return c.label; }));
      rows = spec.rows.map(function (r) {
        return [r.label].concat(r.values.map(function (v) { return fmt.score(v); }));
      });
    } else if (type === "hbar") {
      cols = [spec.tableKey || "Category", spec.measure || "Value"];
      rows = spec.rows.map(function (r) { return [r.label, fmt.score(r.value)]; });
    }

    var wrap = html("div", "table-scroll chart-table-view");
    var table = html("table", "data", wrap);
    if (spec.title) {
      var cap = html("caption", null, table);
      cap.textContent = spec.title + " — table view";
    }
    var thead = html("thead", null, table);
    var htr = html("tr", null, thead);
    cols.forEach(function (c, i) {
      var th = html("th", i === 0 ? "text" : null, htr);
      th.textContent = c;
      th.setAttribute("scope", "col");
    });
    var tbody = html("tbody", null, table);
    rows.forEach(function (r) {
      var tr = html("tr", null, tbody);
      r.forEach(function (v, i) {
        var cell = html(i === 0 ? "th" : "td", i === 0 ? "text" : null, tr);
        if (i === 0) cell.setAttribute("scope", "row");
        cell.textContent = v;
      });
    });
    return wrap;
  }

  /* ----------------------------------------------------------------- mount -- */

  var RENDERERS = {
    scatter: renderScatter,
    lines: renderLines,
    dumbbell: renderDumbbell,
    heatmap: renderHeatmap,
    hbar: renderHBar
  };

  var registry = [];

  /* Mounts a chart into `host` (a .chart-wrap), wires the table-view toggle,
     and re-renders on container resize so text stays crisp at any width. */
  function mount(host, type, spec, opts) {
    opts = opts || {};
    clear(host);
    var userView = opts.view || "chart";
    host.setAttribute("data-view", userView);
    host.addEventListener("chart:view", function (e) { userView = e.detail; });

    var svg = el("svg", { class: "chart-svg", role: "group", "aria-label": spec.title || "chart" });
    host.appendChild(svg);

    function notice(message) {
      var node = host.querySelector(".chart-empty");
      if (!message) { if (node) node.remove(); return; }
      if (!node) {
        node = html("div", "chart-empty", host);
        host.insertBefore(node, svg);
      }
      node.textContent = message;
    }

    function draw() {
      clear(svg);
      var width = Math.max(240, host.clientWidth || 560);
      var ok = RENDERERS[type](svg, spec, { width: width });
      if (ok === "table") {
        /* too cramped to draw honestly — show the values instead */
        svg.setAttribute("height", 0);
        host.setAttribute("data-view", "table");
        notice("Too narrow for the grid at this width — showing the values as a table.");
      } else if (!ok) {
        svg.setAttribute("height", 0);
        host.setAttribute("data-view", "chart");
        notice(spec.emptyMessage || "No runs match the current filters.");
      } else {
        host.setAttribute("data-view", userView);
        notice(null);
      }
      return ok;
    }

    var drew = draw();

    /* legend — always for two or more series; a lone series is named by the title */
    if (drew === true && spec.legend && spec.legend.length > 1) {
      var lg = html("div", "legend", host);
      lg.setAttribute("role", "list");
      spec.legend.forEach(function (item) {
        var li = html("span", "legend-item", lg);
        li.setAttribute("role", "listitem");
        var key = html("span", "legend-key " + (item.shape || "line"), li);
        if (item.shape === "hollow") key.style.color = item.color;
        else key.style.background = item.color;
        html("span", null, li).textContent = item.label;
      });
    }

    if (drew === true && spec.scaleLegend) {
      var sl = html("div", "scale-legend", host);
      html("span", null, sl).textContent = spec.scaleLegend[0];
      var ramp = html("span", "scale-ramp", sl);
      SEQ.forEach(function (c) { html("span", null, ramp).style.background = c; });
      html("span", null, sl).textContent = spec.scaleLegend[1];
    }

    host.appendChild(buildTableTwin(spec, type));

    if (host._ro) host._ro.disconnect();
    var last = host.clientWidth;
    host._ro = new ResizeObserver(function () {
      var w = host.clientWidth;
      if (Math.abs(w - last) > 8) { last = w; draw(); }
    });
    host._ro.observe(host);

    registry.push({ host: host, draw: draw });
    return { redraw: draw };
  }

  function redrawAll() {
    registry = registry.filter(function (r) { return document.body.contains(r.host); });
    registry.forEach(function (r) { r.draw(); });
  }

  global.Charts = {
    mount: mount,
    redrawAll: redrawAll,
    fmt: fmt,
    seqColor: seqColor,
    showTip: showTip,
    hideTip: hideTip,
    html: html,
    niceTicks: niceTicks
  };
})(window);

</script>
<script>
/* ==========================================================================
   NF Knowledge Graph Evaluation — dashboard app.

   Reads the JSON payload embedded by scripts/build_site.py, then builds each
   tab: hero + KPI row, one filter row that scopes everything below it, the
   figures, and the detail tables behind disclosures.

   Colour is assigned to a model ONCE, from the full dataset, and never from a
   filtered subset — so filtering a model out can never repaint the survivors.
   ========================================================================== */
(function () {
  "use strict";

  var C = window.Charts;
  var fmt = C.fmt;
  var DATA = JSON.parse(document.getElementById("site-data").textContent);

  /* ------------------------------------------------------------- DOM utils -- */

  function h(tag, cls, parent) { return C.html(tag, cls, parent); }

  function txt(node, str) { node.textContent = str === null || str === undefined ? "" : String(str); return node; }

  function frag() { return document.createDocumentFragment(); }

  /* ------------------------------------------------------------ stat maths -- */

  function mean(values) {
    var out = [], i;
    for (i = 0; i < values.length; i++) {
      if (values[i] !== null && values[i] !== undefined && !isNaN(values[i])) out.push(values[i]);
    }
    if (!out.length) return null;
    var s = 0;
    for (i = 0; i < out.length; i++) s += out[i];
    return s / out.length;
  }

  function median(values) {
    var out = values.filter(function (v) { return v !== null && v !== undefined && !isNaN(v); })
      .sort(function (a, b) { return a - b; });
    if (!out.length) return null;
    var m = Math.floor(out.length / 2);
    return out.length % 2 ? out[m] : (out[m - 1] + out[m]) / 2;
  }

  function meanOf(runs, getter) { return mean(runs.map(getter)); }

  function bestBy(items, getter) {
    var best = null, bestV = -Infinity;
    items.forEach(function (it) {
      var v = getter(it);
      if (v !== null && v !== undefined && v > bestV) { bestV = v; best = it; }
    });
    return best;
  }

  /* Pareto frontier: cheaper is better, higher score is better. */
  function markFrontier(points) {
    points.forEach(function (p) {
      p.emph = !points.some(function (q) {
        return q !== p && q.x <= p.x && q.y >= p.y && (q.x < p.x || q.y > p.y);
      });
    });
    return points;
  }

  /* ------------------------------------------------------------ components -- */

  function sectionHead(parent, title) {
    var head = h("div", "section-head", parent);
    txt(h("h2", null, head), title);
    h("div", "rule", head);
    return head;
  }

  /* A figure card: title, optional subtitle and NEW badge, a chart/table
     toggle, and the chart mount point. */
  function card(parent, opts) {
    var node = h("div", "card" + (opts.span ? " span-2" : ""), parent);
    var head = h("div", "card-head", node);
    var title = h("div", "card-title", head);
    txt(h("span", null, title), opts.title);
    if (opts.badge) {
      var b = h("span", "badge badge-new", title);
      txt(b, opts.badge);
      title.insertBefore(document.createTextNode(" "), b);
    }
    if (opts.sub) txt(h("p", "card-sub", head), opts.sub);

    var actions = h("div", "card-actions", head);
    var wrap = h("div", "chart-wrap", node);

    if (opts.toggle !== false) {
      var btn = h("button", "ghost-btn", actions);
      btn.type = "button";
      btn.setAttribute("aria-pressed", "false");
      txt(btn, "Table");
      btn.title = "Show the same values as a table";
      btn.addEventListener("click", function () {
        var showing = wrap.getAttribute("data-view") === "table";
        var next = showing ? "chart" : "table";
        wrap.setAttribute("data-view", next);
        wrap.dispatchEvent(new CustomEvent("chart:view", { detail: next }));
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
        if (showing) C.redrawAll();
      });
    }
    return { node: node, wrap: wrap, actions: actions, head: head };
  }

  function disclosure(parent, opts) {
    var d = h("details", "disclosure", parent);
    if (opts.open) d.open = true;
    var s = h("summary", null, d);
    txt(h("span", null, s), opts.summary);
    if (opts.note) txt(h("span", "sum-note", s), opts.note);
    return h("div", "disclosure-body", d);
  }

  /* Sortable table with optional column groups.
     columns: [{key,label,group,align,text,fmt,sortValue,className,hidden}] */
  function dataTable(parent, spec) {
    var scroll = h("div", "table-scroll", parent);
    var table = h("table", "data", scroll);
    if (spec.caption) txt(h("caption", null, table), spec.caption);
    var thead = h("thead", null, table);

    var cols = spec.columns.filter(function (c) { return !c.hidden; });

    var hasGroups = cols.some(function (c) { return c.group; });
    if (hasGroups) {
      var grow = h("tr", "group-row", thead);
      var i = 0;
      while (i < cols.length) {
        var g = cols[i].group || "";
        var span = 1;
        while (i + span < cols.length && (cols[i + span].group || "") === g) span++;
        var th = h("th", i > 0 ? "g" : null, grow);
        th.colSpan = span;
        th.className = (i > 0 ? "g " : "") + (cols[i].align === "left" || cols[i].text ? "text" : "");
        txt(th, g);
        i += span;
      }
    }

    var hrow = h("tr", "head-row", thead);
    cols.forEach(function (c, idx) {
      var th = h("th", null, hrow);
      var isGroupStart = hasGroups && idx > 0 && (c.group || "") !== (cols[idx - 1].group || "");
      th.className = [c.text ? "text" : "", isGroupStart ? "g" : "", spec.sortable === false ? "" : "sortable"]
        .filter(Boolean).join(" ");
      th.setAttribute("scope", "col");
      txt(th, c.label);
      if (c.title) th.title = c.title;
      if (spec.sortable !== false) {
        th.tabIndex = 0;
        var sort = function () {
          var asc = th.getAttribute("aria-sort") === "ascending" ? false : th.getAttribute("aria-sort") === "descending" ? true : !!c.text;
          hrow.querySelectorAll("th").forEach(function (o) { o.removeAttribute("aria-sort"); });
          th.setAttribute("aria-sort", asc ? "ascending" : "descending");
          var body = table.querySelector("tbody");
          var rows = Array.prototype.slice.call(body.querySelectorAll("tr"));
          rows.sort(function (a, b) {
            var av = a._row[c.key], bv = b._row[c.key];
            var an = typeof av === "number", bn = typeof bv === "number";
            if (an && bn) return asc ? av - bv : bv - av;
            if (av === null || av === undefined) return 1;
            if (bv === null || bv === undefined) return -1;
            return asc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
          });
          rows.forEach(function (r) { body.appendChild(r); });
        };
        th.addEventListener("click", sort);
        th.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sort(); }
        });
      }
    });

    var tbody = h("tbody", null, table);
    spec.rows.forEach(function (row) {
      var tr = h("tr", row._class || null, tbody);
      tr._row = row;
      cols.forEach(function (c, idx) {
        var isGroupStart = hasGroups && idx > 0 && (c.group || "") !== (cols[idx - 1].group || "");
        var td = h(idx === 0 ? "th" : "td", null, tr);
        td.className = [c.text ? "text" : "", isGroupStart ? "g" : "", c.className || ""]
          .filter(Boolean).join(" ");
        if (idx === 0) td.setAttribute("scope", "row");
        if (c.render) c.render(td, row);
        else txt(td, c.fmt ? c.fmt(row[c.key], row) : row[c.key]);
      });
    });

    return { scroll: scroll, table: table, tbody: tbody };
  }

  /* ------------------------------------------------------------ model keys -- */

  var MODEL = {};
  DATA.models.forEach(function (m) { MODEL[m.id] = m; });

  function modelColor(id) { return (MODEL[id] && MODEL[id].color) || "var(--muted-mark)"; }
  function modelLabel(id) { return (MODEL[id] && MODEL[id].label) || id; }

  function chipRow(parent, models, state, onChange) {
    var chips = h("div", "chips", parent);
    var buttons = {};
    models.forEach(function (id) {
      var b = h("button", "chip", chips);
      b.type = "button";
      b.setAttribute("aria-pressed", state.has(id) ? "true" : "false");
      h("span", "chip-swatch", b).style.background = modelColor(id);
      txt(h("span", null, b), modelLabel(id));
      buttons[id] = b;
      b.addEventListener("click", function () {
        if (state.has(id)) {
          if (state.size === 1) return;   /* never leave an empty selection */
          state.delete(id);
        } else {
          state.add(id);
        }
        b.setAttribute("aria-pressed", state.has(id) ? "true" : "false");
        onChange();
      });
    });

    /* A chip for a model with nothing in the current slice reads as a bug, so
       say so on the chip rather than leaving the reader to infer it. */
    chips.markAvailability = function (available, reason) {
      Object.keys(buttons).forEach(function (id) {
        var has = available.indexOf(id) >= 0;
        buttons[id].setAttribute("data-empty", has ? "false" : "true");
        buttons[id].title = has ? "" : modelLabel(id) + " — " + reason;
      });
    };
    return chips;
  }

  function segmented(parent, options, current, onChange) {
    var seg = h("div", "segmented", parent);
    seg.setAttribute("role", "group");
    options.forEach(function (o) {
      var b = h("button", null, seg);
      b.type = "button";
      b.setAttribute("aria-pressed", o.value === current() ? "true" : "false");
      txt(b, o.label);
      if (o.title) b.title = o.title;
      b.addEventListener("click", function () {
        if (o.value === current()) return;
        onChange(o.value);
        Array.prototype.forEach.call(seg.children, function (c) {
          c.setAttribute("aria-pressed", c === b ? "true" : "false");
        });
      });
    });
    return seg;
  }

  function filterRow(parent) {
    var row = h("div", "filters", parent);
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", "Filters — these scope every figure and table below");
    return row;
  }

  function filterGroup(parent, label) {
    var g = h("div", "filter-group", parent);
    txt(h("span", "filter-label", g), label);
    return g;
  }

  /* =========================================================================
     TAB 1 — Research tools discovery (nf_rag)
     ========================================================================= */

  var T = DATA.tools;

  function toolsBuild(root) {
    var allModels = [];
    T.runs.forEach(function (r) { if (allModels.indexOf(r.model) < 0) allModels.push(r.model); });
    allModels.sort(function (a, b) { return MODEL[a].slot - MODEL[b].slot; });

    var latestVersion = T.versions.filter(function (v) { return v.isLatest; })[0];

    var state = {
      version: latestVersion ? latestVersion.id : "all",
      models: new Set(allModels)
    };

    /* lede */
    var lede = h("p", "panel-lede", root);
    lede.appendChild(document.createTextNode(
      "An agent answers research-discovery questions against the Synapse portal knowledge graph over SPARQL. " +
      "The score is "));
    txt(h("strong", null, lede), "recall");
    lede.appendChild(document.createTextNode(
      " — the share of the expected resources the agent actually returned. Questions are grouped by " +
      "resource category, by reasoning complexity, and by how painful the same question is on today's portal."));

    var heroHost = h("div", null, root);
    var filters = filterRow(root);
    var body = h("div", null, root);

    /* ---- filter row ---- */
    var vg = filterGroup(filters, "Question set");
    var versionOpts = T.versions.map(function (v) {
      return {
        value: v.id,
        label: v.label + (v.isLatest ? "" : ""),
        title: v.questions + " questions" + (v.isLatest ? " — latest" : "")
      };
    }).concat([{ value: "all", label: "All", title: "Every version — scores are not comparable across sets" }]);
    segmented(vg, versionOpts, function () { return state.version; }, function (v) {
      state.version = v; render();
    });

    var mg = filterGroup(filters, "Models");
    var chips = chipRow(mg, allModels, state.models, render);

    var reset = h("button", "filter-reset", filters);
    reset.type = "button";
    txt(reset, "Reset");
    reset.addEventListener("click", function () {
      state.version = latestVersion ? latestVersion.id : "all";
      state.models = new Set(allModels);
      rebuildFilterUi();
      render();
    });

    var note = h("p", "filter-note", filters);

    function rebuildFilterUi() {
      /* cheapest correct path: rebuild the whole tab */
      C.hideTip();
      root.innerHTML = "";
      toolsBuild(root);
    }

    /* ---- selection ---- */

    function selected() {
      return T.runs.filter(function (r) {
        if (!state.models.has(r.model)) return false;
        if (state.version !== "all" && r.version !== state.version) return false;
        return true;
      });
    }

    /* One entity per model (per version too, when versions are mixed). The
       colour always comes from the model; the version rides a dash pattern and
       a hollow marker, so hue never has to carry two facts at once. */
    function entities(runs) {
      var splitVersion = state.version === "all";
      var map = {}, order = [];
      runs.forEach(function (r) {
        var key = splitVersion ? r.model + "|" + r.version : r.model;
        if (!map[key]) {
          var v = T.versions.filter(function (x) { return x.id === r.version; })[0];
          var older = splitVersion && !(v && v.isLatest);
          map[key] = {
            key: key, model: r.model, version: splitVersion ? r.version : null,
            label: modelLabel(r.model) + (splitVersion ? " · " + r.version : ""),
            color: modelColor(r.model),
            dash: older ? "5 4" : null,
            hollow: older,
            runs: []
          };
          order.push(map[key]);
        }
        map[key].runs.push(r);
      });
      order.forEach(function (e) {
        e.score = meanOf(e.runs, function (r) { return r.score; });
        e.cost = meanOf(e.runs, function (r) { return r.costPerQuestion; });
        e.n = e.runs.length;
      });
      order.sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
      return order;
    }

    function legendOf(ents, shape) {
      return ents.map(function (e) {
        return { label: e.label, color: e.color, shape: e.hollow ? "hollow" : (shape || "line") };
      });
    }

    /* ---- render ---- */

    function render() {
      C.hideTip();
      var runs = selected();
      var ents = entities(runs);
      var vLabel = state.version === "all" ? "all question sets" :
        state.version + " · " + (T.versions.filter(function (v) { return v.id === state.version; })[0] || {}).questions + " questions";

      txt(note, runs.length + " of " + T.runs.length + " scored, complete runs in view · " + vLabel +
        (state.version === "all" ? " — recall is not comparable across question sets, so each set is drawn as its own series" : ""));

      /* which models actually have something to show under this slice? */
      var available = [];
      T.runs.forEach(function (r) {
        if (state.version !== "all" && r.version !== state.version) return;
        if (available.indexOf(r.model) < 0) available.push(r.model);
      });
      chips.markAvailability(available, "no complete run on this question set");

      renderHero(runs);
      body.innerHTML = "";
      renderFigures(body, runs, ents);
      renderDetail(body, runs, ents);
    }

    /* ---- hero + KPIs ---- */

    function renderHero(runs) {
      heroHost.innerHTML = "";
      var hero = h("div", "hero", heroHost);
      var fig = h("div", "hero-figure", hero);
      var kpis = h("div", "kpis", hero);

      var best = bestBy(runs, function (r) { return r.score; });
      txt(h("div", "hero-label", fig), "Best recall");
      if (!best) {
        txt(h("div", "hero-value", fig), "—");
        txt(h("p", "hero-caption", fig), "No runs match the current filters.");
        return;
      }
      txt(h("div", "hero-value", fig), fmt.score2(best.score));
      var cap = h("p", "hero-caption", fig);
      txt(h("span", "hero-model", cap), modelLabel(best.model));
      cap.appendChild(document.createTextNode(
        " · " + best.samples + " questions · " + best.version + " · " + best.date));
      txt(h("p", "hero-note", fig),
        best.stderr === null || best.stderr === undefined ? "" : "± " + best.stderr.toFixed(3) + " standard error");

      function kpi(label, value, caption) {
        var box = h("div", null, kpis);
        txt(h("div", "kpi-label", box), label);
        txt(h("div", "kpi-value", box), value);
        if (caption) txt(h("div", "kpi-caption", box), caption);
        return box;
      }

      var modelsInView = {};
      runs.forEach(function (r) { modelsInView[r.model] = 1; });
      kpi("Models", String(Object.keys(modelsInView).length),
        "of " + DATA.models.length + " ever evaluated");
      kpi("Cost / question", fmt.moneyFine(best.costPerQuestion),
        fmt.money(best.cost) + " for the best run");
      kpi("Time / question", fmt.duration(best.avgSampleTime),
        fmt.duration(best.duration) + " end to end");
      var med = median(runs.map(function (r) { return r.score; }));
      kpi("Median recall", fmt.score2(med), "across " + runs.length + " runs in view");
    }

    /* Per-date bests across every question set, from complete runs only.
       Scored-best and cheapest are tracked separately, because they are often
       different runs. */
    function buildTimeline() {
      var byDate = {};
      T.runs.forEach(function (r) {
        if (!state.models.has(r.model)) return;
        var day = byDate[r.date];
        if (!day) day = byDate[r.date] = { date: r.date, best: null, cheapest: null };
        if (r.score !== null && (day.best === null || r.score > day.best.score)) {
          day.best = r;
        }
        if (r.costPerQuestion !== null &&
            (day.cheapest === null || r.costPerQuestion < day.cheapest.costPerQuestion)) {
          day.cheapest = r;
        }
      });
      return Object.keys(byDate).sort().map(function (k) { return byDate[k]; });
    }

    /* The chart's table twin carries the values but not which run produced
       them, so the headline attribution is stated in plain text as well. */
    function captionFor(cardRef, timeline, which) {
      var note = h("p", "card-sub", cardRef.node);
      note.style.marginTop = "10px";
      var withData = timeline.filter(function (p) { return p[which]; });
      if (!withData.length) { txt(note, ""); return; }

      if (which === "best") {
        var latest = withData[withData.length - 1];
        txt(note, "Latest best: " + modelLabel(latest.best.model) + " on " +
          latest.best.version + " · " + fmt.score(latest.best.score) + " recall");
        return;
      }
      var cheapest = withData.reduce(function (a, b) {
        return b.cheapest.costPerQuestion < a.cheapest.costPerQuestion ? b : a;
      });
      var first = withData[0].cheapest.costPerQuestion;
      var last = withData[withData.length - 1].cheapest.costPerQuestion;
      var text = "Cheapest to date: " + modelLabel(cheapest.cheapest.model) + " · " +
        fmt.moneyFine(cheapest.cheapest.costPerQuestion) + " on " + cheapest.date;
      if (withData.length > 1 && first > 0) {
        var change = Math.round(((last - first) / first) * 100);
        text += " · " + (change <= 0 ? "down " + Math.abs(change) : "up " + change) +
          "% since " + withData[0].date;
      }
      txt(note, text);
    }

    /* ---- figures ---- */

    function renderFigures(parent, runs, ents) {
      sectionHead(parent, "Headline");
      var g1 = h("div", "grid", parent);

      /* cost vs recall — emphasis on the frontier, never eight hues */
      var scatterPoints = markFrontier(ents.filter(function (e) {
        return e.score !== null && e.cost !== null;
      }).map(function (e) {
        return {
          x: e.cost, y: e.score, label: e.label,
          sub: e.n + (e.n === 1 ? " run" : " runs" ) + " averaged",
          rows: [
            { label: "Recall", value: fmt.score(e.score) },
            { label: "Cost / question", value: fmt.moneyFine(e.cost) },
            { label: "Total cost", value: fmt.money(mean(e.runs.map(function (r) { return r.cost; }))) }
          ]
        };
      }));
      var c1 = card(g1, {
        title: "Recall against cost",
        sub: "Cost is per question, so runs on different question sets stay comparable. Solid marks sit on the cost/recall frontier — nothing in view is both cheaper and better."
      });
      C.mount(c1.wrap, "scatter", {
        title: "Recall against cost per question",
        points: scatterPoints,
        xLabel: "Cost per question (USD)",
        yLabel: "Recall",
        xFmt: fmt.moneyAxisFine,
        tableKey: "Model",
        legend: [
          { label: "On the cost/recall frontier", color: "var(--series-1)", shape: "dot" },
          { label: "Dominated by another run", color: "var(--muted-mark)", shape: "dot" }
        ]
      });

      /* complexity */
      var complexCats = T.complexities.map(function (c) { return c.label; });
      var c2 = card(g1, {
        title: "Recall by reasoning complexity",
        sub: "How far the agent must travel through the graph: a direct lookup, one hop, or two."
      });
      C.mount(c2.wrap, "lines", {
        title: "Recall by reasoning complexity",
        categories: complexCats,
        series: ents.map(function (e) {
          return {
            label: e.label, color: e.color, dash: e.dash, hollow: e.hollow,
            values: T.complexities.map(function (c) {
              return meanOf(e.runs, function (r) { return r.difficulty[c.key]; });
            })
          };
        }),
        yLabel: "Recall",
        tableKey: "Model",
        legend: legendOf(ents)
      });

      sectionHead(parent, "Where the graph is strong, and where it is not");
      var g2 = h("div", "grid", parent);

      /* category heatmap — data-driven, so a newly added module shows up here
         the first time it appears in a run */
      var catCols = T.categories.map(function (c) {
        return {
          label: c.label,
          badge: c.isNew ? "new" : null,
          note: c.questions ? String(c.questions) : null
        };
      });
      var c3 = card(g2, {
        title: "Recall by resource category",
        sub: "Mean recall per category. Darker is better. Categories marked new arrived with the latest question set.",
        span: true
      });
      C.mount(c3.wrap, "heatmap", {
        title: "Recall by resource category",
        rows: ents.map(function (e) {
          return {
            label: e.label, color: e.color,
            values: T.categories.map(function (c) {
              return meanOf(e.runs, function (r) { return r.category[c.key]; });
            })
          };
        }),
        cols: catCols,
        measure: "Recall",
        tableKey: "Model",
        scaleLegend: ["0.0 recall", "1.0"]
      });

      var g3 = h("div", "grid", parent);

      /* baseline -> advanced dumbbell — needs two levels to have a gap to show */
      var lvlBase = T.levels[0], lvlAdv = T.levels[T.levels.length - 1];
      if (T.levels.length > 1) {
      var c4 = card(g3, {
        title: "Baseline questions against advanced",
        sub: "Each row is one model: the hollow mark is the baseline question set, the filled mark the advanced one."
      });
      C.mount(c4.wrap, "dumbbell", {
        title: "Baseline against advanced recall",
        rows: ents.map(function (e) {
          return {
            label: e.label, color: e.color,
            a: meanOf(e.runs, function (r) { return r.difficulty[lvlBase.key]; }),
            b: meanOf(e.runs, function (r) { return r.difficulty[lvlAdv.key]; })
          };
        }),
        aLabel: lvlBase.label,
        bLabel: lvlAdv.label,
        xLabel: "Recall",
        tableKey: "Model",
        legend: [
          { label: lvlBase.label, color: "var(--ink-3)", shape: "hollow" },
          { label: lvlAdv.label, color: "var(--ink-3)", shape: "dot" }
        ]
      });
      }

      /* frustration */
      var c5 = card(g3, {
        title: "Recall against portal pain",
        sub: "Questions are graded by how hard the same question is on today's portal. A flat line means the graph is indifferent to what the portal finds difficult."
      });
      C.mount(c5.wrap, "lines", {
        title: "Recall by user frustration on the current portal",
        categories: T.frustrations.map(function (f) { return f.label; }),
        series: ents.map(function (e) {
          return {
            label: e.label, color: e.color, dash: e.dash, hollow: e.hollow,
            values: T.frustrations.map(function (f) {
              return meanOf(e.runs, function (r) { return r.frustration[f.key]; });
            })
          };
        }),
        yLabel: "Recall",
        xLabel: "User frustration with the current portal",
        tableKey: "Model",
        legend: legendOf(ents)
      });
      var nd = h("details", "inline-note", c5.node);
      txt(h("summary", null, nd), "How frustration is graded");
      var nb = h("div", "note-body", nd);
      txt(h("p", null, nb),
        "Each question carries an estimate of how hard it is to answer with the current portal's faceted and text search.");
      var dl = h("dl", null, nb);
      T.frustrationHelp.forEach(function (row) {
        txt(h("dt", null, dl), row[0]);
        txt(h("dd", null, dl), row[1]);
      });

      /* ---- the new PUB module gets its own section ---- */
      var newCats = T.categories.filter(function (c) { return c.isNew; });
      if (newCats.length) {
        sectionHead(parent, "New in the latest question set");
        var g4 = h("div", "grid", parent);
        newCats.forEach(function (cat) {
          var rows = ents.map(function (e) {
            return {
              label: e.label,
              value: meanOf(e.runs, function (r) { return r.category[cat.key]; }),
              color: e.color,
              sub: e.n + (e.n === 1 ? " run" : " runs") + " averaged"
            };
          }).filter(function (r) { return r.value !== null; })
            .sort(function (a, b) { return b.value - a.value; });

          var cc = card(g4, {
            title: cat.label + " module",
            badge: "new",
            sub: cat.blurb || (cat.questions + " questions added in " + (latestVersion ? latestVersion.id : "the latest set") + ".")
          });
          C.mount(cc.wrap, "hbar", {
            title: cat.label + " recall by model",
            rows: rows,
            measure: "Recall",
            xLabel: "Recall",
            xMax: 1,
            tableKey: "Model",
            emptyMessage: "No run in view covers the " + cat.label + " questions yet."
          });

          if (cat.items && cat.items.length) {
            var qd = h("details", "inline-note", cc.node);
            txt(h("summary", null, qd), "The " + cat.items.length + " questions in this module");
            var qb = h("div", "note-body", qd);
            var ol = h("ol", null, qb);
            ol.style.margin = "0";
            ol.style.paddingLeft = "20px";
            cat.items.forEach(function (it) {
              var li = h("li", null, ol);
              li.style.marginBottom = "5px";
              var code = h("code", null, li);
              txt(code, it.id);
              li.appendChild(document.createTextNode(" " + it.question));
            });
          }
        });
      }

      /* ---- progress ---- */
      /* Recomputed per render from the runs themselves, so deselecting a model
         re-picks that day's best rather than dropping the day entirely. The
         question-set filter is deliberately ignored: this is the arc of the
         pipeline across sets, which is why each point names its own set. */
      var timeline = buildTimeline();
      if (timeline.length > 1) {
        sectionHead(parent, "Progress");
        var g5 = h("div", "grid", parent);
        var dates = timeline.map(function (p) { return p.date; });

        /* Two measures on two different scales, so two charts sharing one time
           axis — never one plot with two y-axes. */
        var c6 = card(g5, {
          title: "Best recall over time",
          sub: "The highest-scoring complete run on each evaluation date, across every question set. The set changes along the way, so this tracks the pipeline rather than one fixed benchmark."
        });
        C.mount(c6.wrap, "lines", {
          title: "Best recall by evaluation date",
          categories: dates,
          series: [{
            label: "Best recall",
            color: "var(--series-1)",
            values: timeline.map(function (p) { return p.best ? p.best.score : null; })
          }],
          yLabel: "Recall",
          endLabels: false,
          tipSub: "highest-scoring run that day",
          tableKey: "Date",
          pointRows: function (i) {
            var run = timeline[i].best;
            if (!run) return [];
            return [
              { label: "Model", value: modelLabel(run.model) },
              { label: "Question set", value: run.version },
              { label: "Cost / question", value: fmt.moneyFine(run.costPerQuestion) }
            ];
          },
          emptyMessage: "No scored runs for the selected models."
        });
        captionFor(c6, timeline, "best");

        var c7 = card(g5, {
          title: "Best cost per question over time",
          sub: "The lowest cost per question among complete runs each date — lower is better. Read it beside recall: the cheapest run of the day is not always the best one, so each point names both."
        });
        C.mount(c7.wrap, "lines", {
          title: "Best cost per question by evaluation date",
          categories: dates,
          series: [{
            label: "Lowest cost / question",
            color: "var(--series-2)",
            values: timeline.map(function (p) {
