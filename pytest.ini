[pytest]
# Pytest configuration for NF-OSI KG pipeline

# Test discovery
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --maxfail=5
    -n auto

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    rml: marks tests for RML mappings
    iri: marks tests for IRI transformations
    relationships: marks tests for entity relationships

# Coverage options (when running with --cov)
[coverage:run]
source = scripts
omit =
    */tests/*
    */test_*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
